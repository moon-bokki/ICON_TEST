      const hasFill =
        (rootFill && rootFill !== 'none') ||
        [...body.matchAll(/\sfill\s*=\s*["']([^"']*)["']/gi)].some(
          (m) => m[1].toLowerCase() !== 'none'
        );
      const mode = hasStroke || !hasFill ? 'line' : 'fill';
      if (mode === 'fill') {
        warnings.push('채움(fill) 아이콘으로 인식해 currentColor 로 칠하도록 처리했습니다.');
      }

      /* 5. 속성 정리 · 한 줄로 압축 */
      body = body
        .replace(new RegExp(`\\s(?:${DROP_ATTRS})\\s*=\\s*(?:"[^"]*"|'[^']*'|[^\\s>]+)`, 'gi'), '')
        .replace(/\s+/g, ' ')
        .replace(/>\s+</g, '><')
        .replace(/<(path|circle|rect|line|polyline|polygon|ellipse)([^>]*?)><\/\1>/gi, '<$1$2/>')
        .replace(/\s+\/>/g, '/>')
        .trim();

      if (!SHAPE_TAGS.test(body)) {
        throw new Error('그릴 수 있는 도형(path·circle·rect 등)을 찾지 못했습니다.');
      }

      /* 6. 감싸기 — 채움 모드와 크기 보정 */
      if (mode === 'fill') body = `<g fill="currentColor" stroke="none">${body}</g>`;
      if (transform.length) body = `<g transform="${transform.join(' ')}">${body}</g>`;

      return { body, mode, scale, size: `${round(w)}×${round(h)}`, warnings };
    }

     */

    const SIZE_LADDER = [16, 20, 24, 32, 48, 64, 96, 128];

    /* ══════════════════════════════════════════
       GIF 헤더 파서
       해상도 · 프레임 수 · 재생 시간 · 반복 · 투명도
       ══════════════════════════════════════════ */
    function skipSubBlocks(b, p) {
      while (p < b.length && b[p] !== 0) p += b[p] + 1;
      return p + 1;
    }

    function parseGif(buffer) {
      const b = new Uint8Array(buffer);
      const dv = new DataView(buffer);
      // 헤더(13바이트)조차 없으면 GIF 가 아니거나 잘린 파일
      if (b.length < 13) return null;
      if (String.fromCharCode(b[0], b[1], b[2]) !== 'GIF') return null;

      /** 범위를 벗어난 읽기는 0 으로 (잘린 파일 방어) */
      const u16 = (o) => (o + 1 < b.length ? dv.getUint16(o, true) : 0);

      const width = u16(6);
      const height = u16(8);
      const packed = b[10];

      const hasGlobalPalette = !!(packed & 0x80);
      let p = 13;
      if (hasGlobalPalette) p += 3 * (1 << ((packed & 7) + 1)); // 전역 색상표 건너뛰기

      let frames = 0;
      let durationMs = 0;
      let transparent = false;
      let loops = null;
      let localPalettes = 0;
      let guard = 0;

      while (p < b.length && guard++ < 200000) {
        const marker = b[p];

        if (marker === 0x3b) break; // trailer

        if (marker === 0x21) {
          const label = b[p + 1];
          p += 2;
          if (label === 0xf9) {
            // Graphic Control Extension
            const size = b[p];
            const gce = b[p + 1];
            const delay = u16(p + 2);
            if (gce & 1) transparent = true;
            // 브라우저는 delay < 2 를 10(=100ms)으로 보정한다
            durationMs += (delay < 2 ? 10 : delay) * 10;
            p = skipSubBlocks(b, p + size + 1);
          } else if (label === 0xff) {
            // Application Extension (NETSCAPE 반복 횟수)
            const size = b[p];
            const app = String.fromCharCode(...b.slice(p + 1, p + 12));
            const q = p + 1 + size;
            if (app.startsWith('NETSCAPE') && b[q] >= 3) loops = u16(q + 2);
            p = skipSubBlocks(b, q);
          } else if (label === 0xfe) {
            p = skipSubBlocks(b, p); // Comment
          } else {
            p = skipSubBlocks(b, p + 1 + b[p]); // Plain Text 등
          }
        } else if (marker === 0x2c) {
          // Image Descriptor
          frames++;
          const lpacked = b[p + 9];
          p += 10;
          if (lpacked & 0x80) {
            localPalettes++;
            p += 3 * (1 << ((lpacked & 7) + 1)); // 지역 색상표
          }
          p += 1; // LZW 최소 코드 크기
          p = skipSubBlocks(b, p);
        } else {
          p++;
        }
      }

      return {
        format: 'GIF',
        width,
        height,
        frames,
        durationMs,
        loops, // 0 = 무한
        transparent,
        // 프레임이 지역 팔레트를 쓰면 색상은 프레임마다 따로 정해진다
        localPalettes,
        colors: hasGlobalPalette ? 1 << ((packed & 7) + 1) : null,
      };
    }

    /* ══════════════════════════════════════════
       에셋 로더
       fetch 로 원본을 읽어 메타데이터 + Blob URL 확보.
       file:// 로 열었을 때는 fetch 가 막히므로 <img> 직접 로드로 폴백.
       ══════════════════════════════════════════ */
    function useAsset(src, initialBlob) {
      const [state, setState] = useState({ status: 'loading', url: src, meta: null, bytes: null });
      const blobRef = useRef(initialBlob || null);
      const urlRef = useRef(null);

      useEffect(() => {
        let alive = true;

        async function load() {
          // 드롭된 파일은 이미 Blob 을 가지고 있다
          if (blobRef.current) {
            const buf = await blobRef.current.arrayBuffer();
            if (!alive) return;
            const url = URL.createObjectURL(blobRef.current);
            urlRef.current = url;
            setState({
              status: 'ok',
              url,
              bytes: blobRef.current.size,
              meta: parseGif(buf),
            });
            return;
          }

          try {
            const res = await fetch(src);
            if (!res.ok) throw new Error(String(res.status));
            const buf = await res.arrayBuffer();
            if (!alive) return;
            const blob = new Blob([buf]);
            blobRef.current = blob;
            const url = URL.createObjectURL(blob);
            urlRef.current = url;
            setState({ status: 'ok', url, bytes: buf.byteLength, meta: parseGif(buf) });
          } catch {
            // file:// 등 — 이미지 자체는 표시되지만 메타데이터는 못 읽는다
            if (alive) setState({ status: 'limited', url: src, meta: null, bytes: null });
          }
        }

        load();
        return () => {
          alive = false;
          if (urlRef.current) URL.revokeObjectURL(urlRef.current);
        };
      }, [src]);

      /** 애니메이션 처음부터 다시 재생 */
      const restart = useCallback(() => {
        setState((s) => {
          if (blobRef.current) {
            if (urlRef.current) URL.revokeObjectURL(urlRef.current);
            const url = URL.createObjectURL(blobRef.current);
            urlRef.current = url;
            return { ...s, url };
          }
          const base = src.split('?')[0];
          return { ...s, url: `${base}?r=${Date.now()}` };
        });
      }, [src]);

      return [state, restart];
    }

    /* ══════════════════════════════════════════
       실제 픽셀 크기로 다시 렌더링 (리사이즈 · 내보내기)
       640px 원본을 24px 로 "표시"만 하는 게 아니라
       진짜 24px 이미지로 만들어 준다.
       ══════════════════════════════════════════ */
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('이미지를 불러오지 못했습니다'));
        img.src = url;
      });
    }

    /**
     * @param url   원본 이미지 URL (blob: 권장 — file:// 경로는 캔버스가 오염된다)
     * @param px    출력할 정사각형 픽셀 크기
     * @param type  'image/png' | 'image/webp'
     * @returns {Promise<Blob>}
     */
    async function renderAtSize(url, px, type = 'image/png') {
      const img = await loadImage(url);
      const canvas = document.createElement('canvas');
      canvas.width = px;
      canvas.height = px;

      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 비율을 유지한 채 정사각형 캔버스 가운데 배치
      const w = img.naturalWidth || px;
      const h = img.naturalHeight || px;
      const ratio = Math.min(px / w, px / h);
      const dw = Math.max(1, Math.round(w * ratio));
      const dh = Math.max(1, Math.round(h * ratio));
      ctx.drawImage(img, Math.round((px - dw) / 2), Math.round((px - dh) / 2), dw, dh);

      return new Promise((resolve, reject) => {
        try {
          canvas.toBlob(
            (blob) => (blob ? resolve(blob) : reject(new Error('이미지를 만들지 못했습니다'))),
            type
          );
        } catch {
          // 캔버스 오염(file:// 에서 흔함)
          reject(new Error('보안 정책 때문에 이 이미지를 변환할 수 없습니다'));
        }
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function formatBytes(n) {
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1024 / 1024).toFixed(2)} MB`;
    }

    /** 맵에서 키 하나를 지운 새 객체 (없으면 원본 그대로) */
    function withoutKey(map, key) {
      if (!(key in map)) return map;
      const copy = { ...map };
      delete copy[key];

    }

    /**
     * 저장되는 맵 하나를 관리한다.
     *
     * 1. 첫 렌더는 localStorage 값으로 즉시 그린다 (기다리지 않는다)
     * 2. Supabase 가 설정돼 있으면 원격 값을 받아 덮어쓴다
     * 3. 값이 바뀌면 localStorage 에 쓰고 원격에도 반영한다

     * 원격을 받아오기 전에 밀어 올리면 남의 데이터를 지울 수 있으므로,
     * 처음 불러오기가 끝나기 전에는 push 하지 않는다.
     */
    function useSyncedMap(kind, cacheKey, showToast) {
      const [map, setMap] = useState(() => readLocal(cacheKey, {}));
      const loaded = useRef(!isRemote);

      useEffect(() => {
        if (!isRemote) return;
        let alive = true;
        pullRemote(kind)
          .then((remote) => {
            if (!alive || !remote) return;
            setMap(remote);
            writeLocal(cacheKey, remote);
          })
          .catch((e) => showToast?.(`동기화 실패 — ${e.message}`))
          .finally(() => {
            if (alive) loaded.current = true;
          });
        return () => {
          alive = false;
        };
      }, [kind, cacheKey, showToast]);

      useEffect(() => {
        writeLocal(cacheKey, map);
        if (!isRemote || !loaded.current) return;
        pushRemote(kind, map).catch((e) => showToast?.(`저장 실패 — ${e.message}`));
      }, [kind, cacheKey, map, showToast]);

      return [map, setMap];
    }

    function useTheme() {

      useEffect(() => {
        document.documentElement.dataset.theme = theme;

      }, [theme]);

      const toggleTheme = useCallback(() => setTheme((t) => (t === 'light' ? 'dark' : 'light')), []);

      return [theme, toggleTheme];

    function useToast() {

      return [toast, showToast];

    /**
     * ICONS 의 기본 태그에 덧붙이는 사용자 태그.
     * 키: 라인 아이콘은 아이콘 이름, 이미지 아이콘은 "@파일명"

    function useCustomTags(showToast) {
      const [customTags, setCustomTags] = useSyncedMap('tag', TAGS_KEY, showToast);

      const addTags = useCallback(
        (key, raw) => {
          const builtin = lookupIcon(key)?.tags || [];
          const existing = customTags[key] || [];
          const fresh = [];
          for (const part of String(raw).split(/[,\n]+/)) {
            const tag = part.trim();
            if (!tag) continue;
            if (builtin.includes(tag) || existing.includes(tag) || fresh.includes(tag)) continue;
            fresh.push(tag);
          }
          if (!fresh.length) {
            showToast('이미 있는 태그입니다');
            return;
          }
          setCustomTags((prev) => ({ ...prev, [key]: [...(prev[key] || []), ...fresh] }));
          showToast(`태그 ${fresh.length}개 추가됨`);
        },
        [customTags, showToast]
      );

      const removeTag = useCallback((key, tag) => {
        setCustomTags((prev) => {
          const next = (prev[key] || []).filter((t) => t !== tag);
          const copy = { ...prev };
          if (next.length) copy[key] = next;
          else delete copy[key];
          return copy;
        });
      }, []);

      /** 이름을 바꾼 뒤 남은 옛 키를 정리한다 */
      const dropTags = useCallback((key) => setCustomTags((prev) => withoutKey(prev, key)), []);

      /**
       * 분류 칩 숨기기 — 아이콘은 그대로 두고 상단 필터에서만 감춘다.
       * 소속 아이콘을 건드리지 않으므로 복원하면 원래대로 완전히 돌아온다.
       */
      const hideCategory = useCallback(
        (name) => {
          setHidden((prev) => ({ ...prev, [categoryKey(name)]: true }));
          showToast(`‘${name}’ 분류를 지웠습니다 · 아이콘은 그대로 있습니다`);
        },
        [showToast]
      );

      /** 지운 분류를 모두 되살린다 (아이콘 숨김 기록은 건드리지 않음) */
      const restoreCategories = useCallback(() => {
        setHidden((prev) => {
          const next = {};
          for (const k of Object.keys(prev)) if (!k.startsWith('#')) next[k] = prev[k];
          return next;
        });
        showToast('지운 분류를 모두 되살렸습니다');
      }, [showToast]);

      return { hidden, hide, restore, restoreAll, hideCategory, restoreCategories };
    }

    /**
     * 화면에서 추가한 SVG 아이콘.
     * localStorage 에 저장하고, Icon 컴포넌트가 찾을 수 있도록 레지스트리에 등록한다.
     */
    function useCustomIcons(showToast) {
      const [customIcons, setCustomIcons] = useSyncedMap('icons', CUSTOM_ICON_KEY, showToast);

      // 렌더 도중 등록해야 이번 렌더에서 바로 그릴 수 있다
      useMemo(() => registerCustomIcons(customIcons), [customIcons]);

      const addIcon = useCallback(
        (name, def, message) => {
          setCustomIcons((prev) => ({ ...prev, [name]: def }));
          showToast(message || `‘${name}’ 아이콘을 추가했습니다`);
        },
        [showToast]
      );

      const removeIcon = useCallback(
        (name) => {
          setCustomIcons((prev) => {
            if (!(name in prev)) return prev;
            const copy = { ...prev };
            delete copy[name];
            return copy;
          });
          showToast(`‘${name}’ 아이콘을 삭제했습니다`);
        },
        [showToast]
      );

      return { customIcons, addIcon, removeIcon };
    }

    /**
     * 아이콘을 다른 분류로 옮긴 기록.
     * 키 규칙은 사용자 태그와 같고, 값은 옮겨간 분류 이름이다.
     * 기본 분류로 되돌아가면 항목을 지워 저장소를 깨끗하게 유지한다.
     */
    function useCustomCategories(showToast) {
      const [customCategories, setCustomCategories] = useSyncedMap('category', CATEGORY_KEY, showToast);

      const moveCategory = useCallback(
        (key, next, builtin) => {
          const name = String(next).trim();
          if (!name) return;
          if (name === builtin) {
            setCustomCategories((prev) => {
              if (!(key in prev)) return prev;
              const copy = { ...prev };
              delete copy[key];
              return copy;
            });
          } else {
            setCustomCategories((prev) => ({ ...prev, [key]: name }));
          }
          showToast(`‘${name}’ 분류로 옮겼습니다`);
        },
        [showToast]
      );

      const resetCategory = useCallback(
        (key, builtin) => {
          setCustomCategories((prev) => {
            if (!(key in prev)) return prev;
            const copy = { ...prev };
            delete copy[key];
            return copy;
          });
          showToast(`‘${builtin}’ 분류로 되돌렸습니다`);
        },
        [showToast]
      );

      /** 이름을 바꾼 뒤 남은 옛 키를 정리한다 */
      const dropCategory = useCallback(
        (key) => setCustomCategories((prev) => withoutKey(prev, key)),
        []
      );

      return { customCategories, moveCategory, resetCategory, dropCategory };
    }

    /* ───── src/components/Icon.jsx ───── */
    /**
     * 아이콘 컴포넌트
     *
     * @example
     * <Icon name="search" />
     * <Icon name="loader" size={20} spin />
     * <Icon name="trash" color="#dc2626" strokeWidth={2} title="삭제" />
     *
     * props
     *  - name        : 아이콘 이름 (필수)
     *  - size        : px 크기 (기본 24). CSS 로 제어하려면 size="1em"
     *  - strokeWidth : 선 두께 (기본 1.75)
     *  - color       : 색상 (기본 currentColor — 부모 글자색을 따라감)
     *  - title       : 지정하면 의미 있는 이미지(role="img")로, 없으면 장식용(aria-hidden)
     *  - spin        : 회전 애니메이션
     *  - pulse       : 깜빡임 애니메이션
     *  - rotate      : 회전 각도 (deg)
     *  - flip        : 'x' | 'y' | 'xy'
     *  - absoluteStrokeWidth : true 면 크기가 변해도 선 두께를 24px 기준으로 고정
     */
    const Icon = forwardRef(function Icon(
      {
        name,
        size = 24,
        strokeWidth = 1.75,
        color = "currentColor",
        title,
        spin = false,
        pulse = false,
        rotate = 0,
        flip,
        absoluteStrokeWidth = false,
        className = "",
        style,
        ...rest
      },
      ref,
    ) {
      const icon = lookupIcon(name);

      const transform = useMemo(() => {
        const t = [];
        if (rotate) t.push(`rotate(${rotate}deg)`);
        if (flip === "x" || flip === "xy") t.push("scaleX(-1)");
        if (flip === "y" || flip === "xy") t.push("scaleY(-1)");
        return t.length ? t.join(" ") : undefined;
      }, [rotate, flip]);

      if (!icon) {
        console.warn(`[Icon] "${name}" 아이콘을 찾을 수 없습니다.`);
        return null;
      }

      const numeric =
        typeof size === "number" || /^\d+(\.\d+)?$/.test(String(size));
      const px = numeric ? Number(size) : null;
      // 크기 보정으로 줄어든 만큼 두께를 되돌린다 (아래 iconScale 설명 참고)
      const base = absoluteStrokeWidth && px ? (strokeWidth * 24) / px : strokeWidth;
      const sw = base / iconScale(icon);

      const cls = [
        "ui-icon",
        spin && "ui-icon-spin",
        pulse && "ui-icon-pulse",
        className,
      ]
        .filter(Boolean)
        .join(" ");

      return (
        <svg
          ref={ref}
          className={cls}
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width={px ?? size}
          height={px ?? size}
          fill="none"
          stroke={color}
          strokeWidth={sw}
          strokeLinecap="round"
          strokeLinejoin="round"
          role={title ? "img" : undefined}
          aria-hidden={title ? undefined : true}
          focusable="false"
          // 채움(fill) 아이콘은 내부에서 currentColor 를 쓰므로 글자색도 함께 맞춰 준다
          style={{
            display: "block",
            flex: "none",
            transform,
            ...(color !== "currentColor" ? { color } : null),
            ...style,
          }}
          dangerouslySetInnerHTML={{
            __html: (title ? `<title>${escapeXml(title)}</title>` : "") + icon.body,
          }}
          {...rest}
        />
      );
    });

    function escapeXml(s) {
      return String(s).replace(
        /[<>&"]/g,
        (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" })[c],
      );
    }

    /** 아이콘 하나를 독립 실행 가능한 SVG 문자열로 반환 */
    function toSvgString(
      name,
      { size = 24, strokeWidth = 1.75, color = "currentColor" } = {},
    ) {
      const icon = lookupIcon(name);
      if (!icon) return "";
      const sw = Number((strokeWidth / iconScale(icon)).toFixed(4));
      return (
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" ` +
        `fill="none" stroke="${color}" stroke-width="${sw}" ` +
        (color === "currentColor" ? "" : `color="${color}" `) +
        `stroke-linecap="round" stroke-linejoin="round">` +
        icon.body.replace(/\/><path/g, "/>\n  <path").replace(/^</, "\n  <") +
        `\n</svg>`
      );
    }

    /* ───── src/components/CodeBlock.jsx ───── */
    /** 복사 버튼이 달린 코드 블록 */
    function CodeBlock({ code, onCopy }) {

    /**
     * 상세 패널의 삭제 · 복원 버튼
     *
     * - permanent=false : 기본 아이콘 — 목록에서 감추고 언제든 복원할 수 있다

    function DeleteButton({ hidden, permanent, onDelete, onRestore }) {

        >

    /* ───── src/components/NameEditor.jsx ───── */
    /**
     * 상세 패널 머리말의 이름 편집기
     * 평소에는 이름만 보여 주고, 연필 버튼을 누르면 입력칸으로 바뀐다.
     */
    function NameEditor({ name, existingNames, onRename, freeform }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(name);

      // 이미지 아이콘의 라벨은 코드 키가 아니라 표시용이라 한글·대문자도 허용한다
      const value = freeform ? draft.trim() : draft.trim().toLowerCase();
      const unchanged = value === name;
      const duplicate = !unchanged && existingNames.includes(value);
      const invalid = !freeform && !!value && !ICON_NAME_RULE.test(value);
      const ready = !!value && !duplicate && !invalid;

      const open = () => {
        setDraft(name);
        setEditing(true);
      };

      const close = () => {
        setEditing(false);
        setDraft(name);
      };

      const submit = (e) => {
        e.preventDefault();
        if (!ready) return;
        if (!unchanged) onRename(value);
        setEditing(false);
      };

      if (!editing) {
        return (
          <>
            <span className="title">{name}</span>
            <button className="icon-btn" onClick={open} title="이름 수정" aria-label="이름 수정">
              <Icon name="edit" size={15} />
            </button>
          </>
        );
      }

      return (
        <form className="name-editor" onSubmit={submit}>
          <input
            autoFocus
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => e.key === 'Escape' && close()}
            aria-label="아이콘 이름"
            aria-invalid={duplicate || invalid}
          />
          <button type="submit" className="icon-btn" disabled={!ready} title="확인" aria-label="확인">
            <Icon name="check" size={16} />
          </button>
          <button type="button" className="icon-btn" onClick={close} title="취소" aria-label="취소">
            <Icon name="x" size={16} />
          </button>
          {(duplicate || invalid) && (
            <span className="name-error">
              {duplicate ? '이미 있는 이름입니다' : '영문 소문자·숫자·하이픈(-)만 쓸 수 있습니다'}
            </span>
          )}
        </form>
      );
    }

    /* ───── src/components/BgPicker.jsx ───── */
    /**
     * 미리보기 배경 선택기 (상세 패널 안)
     * 프리셋 6종 + 직접 고른 색.

    function BgPicker({ value, custom, onChange, onCustom }) {
      return (

            >

    }

    /* ───── src/components/CategoryPicker.jsx ───── */
    const NEW_CATEGORY = '__new__';

    /**
     * 분류 이동 선택기 (상세 패널 안)
     * 기존 분류 중에서 고르거나, 새 분류를 만들어 옮긴다.
     * 기본 분류(icons.js)와 달라지면 '되돌리기' 버튼이 나타난다.
     */
    function CategoryPicker({
      value,
      builtin,
      categories,
      onChange,
      onReset,
      onCopy,
    }) {
      const [creating, setCreating] = useState(false);
      const [draft, setDraft] = useState('');

      // 목록에 없는 분류(직접 만든 것)로 옮겨둔 상태라면 그 값도 보여준다
      const options = categories.includes(value) ? categories : [...categories, value];
      const moved = value !== builtin;

      const submit = (e) => {
        e.preventDefault();
        const name = draft.trim();
        if (!name) return;
        onChange(name);
        setDraft('');
        setCreating(false);
      };

      return (
        <div className="category-picker">
          <div className="category-row">
            <select
              className="category-select"
              value={creating ? NEW_CATEGORY : value}
              onChange={(e) => {
                if (e.target.value === NEW_CATEGORY) {
                  setCreating(true);
                  return;
                }
                setCreating(false);
                onChange(e.target.value);
              }}
              aria-label="분류 이동"
            >
              {options.map((c) => (
                <option key={c} value={c}>
                  {c}
                </option>
              ))}
              <option value={NEW_CATEGORY}>+ 새 분류 만들기…</option>
            </select>

            {moved && (
              <button
                type="button"
                className="demo-btn sm ghost"
                onClick={onReset}
                title={`기본 분류 ‘${builtin}’ 로 되돌리기`}
              >
                <Icon name="refresh" size={13} />
                되돌리기
              </button>
            )}
          </div>

          {creating && (
            <form className="tag-form" onSubmit={submit}>

                aria-label="새 분류 이름"
              />
              <button type="submit" className="demo-btn sm" disabled={!draft.trim()}>
                <Icon name="plus" size={13} />
                만들기
              </button>
              <button
                type="button"
                className="demo-btn sm ghost"
                onClick={() => {
                  setCreating(false);
                  setDraft('');
                }}
              >
                취소
              </button>
            </form>
          )}

          <div className="tag-foot">
            <span>
              {moved
                ? `기본 분류는 ‘${builtin}’ 입니다. 옮긴 기록은 이 브라우저에 저장됩니다.`
                : '옮기면 분류 필터에 바로 반영되고 이 브라우저에 저장됩니다.'}
            </span>
            <button type="button" className="link-btn" onClick={onCopy}>
              <Icon name="copy" size={12} />
              icons.js 용 category 복사
            </button>
          </div>
        </div>
      );
    }

    /* ───── src/components/AddIconDialog.jsx ───── */
    const IMPORT_PREVIEW_SIZES = [16, 24, 32, 48];

    /**
     * SVG 아이콘 추가 대화상자
     * 붙여넣은 코드나 .svg 파일을 라인 아이콘으로 변환해 목록에 넣는다.
     */
    function AddIconDialog({
      categories,
      strokeWidth,
      color,
      existingNames,
      onAdd,
      onClose,
      onCopy,
    }) {
      const [source, setSource] = useState('');
      const [name, setName] = useState('');
      const [category, setCategory] = useState(categories[0] || '기타');
      const [tagText, setTagText] = useState('');
      const fileRef = useRef(null);

      /* 미리보기 전용 두께·색 — 툴바 값에서 시작하되 여기서 따로 바꿔볼 수 있다 */
      const [previewStroke, setPreviewStroke] = useState(strokeWidth);
      const [previewColor, setPreviewColor] = useState(color);

      /* 붙여넣은 코드가 바뀔 때마다 변환을 다시 시도한다 */
      const parsed = useMemo(() => {
        if (!source.trim()) return null;
        try {
          return { ok: true, ...parseSvgSource(source) };
        } catch (e) {
          return { ok: false, message: e.message };
        }
      }, [source]);

      const tags = tagText
        .split(/[,\n]+/)
        .map((t) => t.trim())
        .filter(Boolean);

      const duplicate = !!name && existingNames.includes(name);
      const badName = !!name && !ICON_NAME_RULE.test(name);
      const ready = parsed?.ok && name && !duplicate && !badName;

      const readFile = async (file) => {
        if (!file) return;
        setSource(await file.text());
        if (!name) setName(toIconName(file.name));
      };

      const snippet = ready
        ? toIconsJsSnippet(name, { category, tags, body: parsed.body, scale: parsed.scale })
        : '';

      const submit = (e) => {
        e.preventDefault();
        if (!ready) return;
        onAdd(name, { category, tags, body: parsed.body, scale: parsed.scale, custom: true });
        onClose();
      };

      return (
        <>
          <div className="scrim" onClick={onClose} />
          <div
            className="dialog"
            role="dialog"
            aria-modal="true"
            aria-label="SVG 아이콘 추가"
            onDragEnter={(e) => e.stopPropagation()}
            onDragOver={(e) => {
              e.stopPropagation();
              e.preventDefault();
            }}
            onDrop={(e) => {
              e.stopPropagation();
              e.preventDefault();
              readFile(e.dataTransfer.files?.[0]);
            }}
          >
            <div className="panel-head">
              <Icon name="plus" size={18} />
              <span className="title">SVG 아이콘 추가</span>
              <span className="spacer" />
              <button className="icon-btn" onClick={onClose} aria-label="닫기">
                <Icon name="x" size={17} />
              </button>
            </div>

            <form className="dialog-body" onSubmit={submit}>
              <div className="section-label">SVG 코드</div>
              <textarea
                className="svg-input"
                value={source}
                onChange={(e) => setSource(e.target.value)}
                placeholder={'<svg viewBox="0 0 24 24" ...> 전체를 붙여넣거나\n<path d="..."/> 만 넣어도 됩니다'}
                aria-label="SVG 코드"
                spellCheck="false"
              />
              <div className="dialog-row">
                <button type="button" className="demo-btn sm" onClick={() => fileRef.current?.click()}>
                  <Icon name="upload" size={13} />
                  .svg 파일 선택
                </button>
                <input
                  ref={fileRef}
                  type="file"
                  accept=".svg,image/svg+xml"
                  hidden
                  onChange={(e) => {
                    readFile(e.target.files?.[0]);
                    e.target.value = '';
                  }}
                />
                {source && (
                  <button type="button" className="demo-btn sm ghost" onClick={() => setSource('')}>
                    지우기
                  </button>
                )}
                <span className="hint dialog-hint">파일을 이 창에 끌어다 놓아도 됩니다</span>
              </div>

              {parsed && !parsed.ok && (
                <p className="hint import-error">
                  <Icon name="alert-triangle" size={13} /> {parsed.message}
                </p>
              )}

              {parsed?.ok && (
                <>
                  <div className="section-label">미리보기</div>
                  <div className="import-preview">
                    {IMPORT_PREVIEW_SIZES.map((s) => (
                      <figure key={s}>
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"

    /* ───── src/components/ExportBox.jsx ───── */
    /**
     * 크기 변환 · 내보내기
     * 원본(예: 640px)을 실제 목표 픽셀로 다시 렌더링해 저장한다
     */
    function ExportBox({ item, url, size, onToast }) {
      const [px, setPx] = useState(Math.max(8, Math.round(size)));
      const [scale, setScale] = useState(1);
      const [type, setType] = useState('image/png');
      const [result, setResult] = useState(null); // { url, bytes }
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const outPx = Math.min(1024, Math.max(8, Math.round(px * scale)));
      const ext = type === 'image/webp' ? 'webp' : 'png';
      const filename = `${item.name}-${px}${scale > 1 ? `@${scale}x` : ''}.${ext}`;

      /* 설정이 바뀌면 미리보기를 다시 만든다 */
      useEffect(() => {
        let alive = true;
        let objectUrl = null;
        setError('');
        setBusy(true);

        const timer = setTimeout(async () => {
          try {
            const blob = await renderAtSize(url, outPx, type);
            if (!alive) return;
            objectUrl = URL.createObjectURL(blob);
            setResult({ url: objectUrl, bytes: blob.size, blob });
          } catch (e) {
            if (alive) {
              setResult(null);
              setError(e.message);
            }
          } finally {
            if (alive) setBusy(false);
          }
        }, 220);

        return () => {
          alive = false;
          clearTimeout(timer);
          if (objectUrl) URL.revokeObjectURL(objectUrl);
        };
      }, [url, outPx, type]);

      return (
        <div className="export-box">
          <div className="export-row">
            <label htmlFor="export-px">크기</label>
            <input
              id="export-px"
              type="number"
              min="8"
              max="512"
              value={px}
              onChange={(e) => setPx(Math.max(1, Number(e.target.value) || 1))}
            />
            <span className="unit">px</span>
            <div className="seg sm">
              {[1, 2, 3].map((s) => (
                <button
                  key={s}
                  className="seg-btn"
                  aria-pressed={scale === s}
                  onClick={() => setScale(s)}
                >
                  @{s}x
                </button>
              ))}
            </div>
          </div>

          <div className="export-row">
            <label>형식</label>
            <div className="seg sm">
              <button
                className="seg-btn"
                aria-pressed={type === 'image/png'}
                onClick={() => setType('image/png')}
              >
                PNG
              </button>
              <button
                className="seg-btn"
                aria-pressed={type === 'image/webp'}
                onClick={() => setType('image/webp')}
              >
                WebP
              </button>
            </div>
            <span className="export-out">
              → {outPx} × {outPx}px
            </span>
          </div>

          {error ? (
            <p className="hint export-error">
              {error} — <code>npm run dev</code> 로 실행하거나 파일을 페이지에 드래그해 추가하면 변환할
              수 있습니다.
            </p>
          ) : (
            <div className="export-result">
              <div className="export-preview">
                {result && (
                  <img
                    src={result.url}
                    alt="변환 결과"
                    style={{ width: Math.min(outPx, 128), height: Math.min(outPx, 128) }}
                  />
                )}
              </div>
              <div className="export-info">
                <div className="export-size">
                  {busy ? '변환 중…' : result ? formatBytes(result.bytes) : '—'}
                </div>
                <div className="export-name">{filename}</div>
                <button
                  className="demo-btn sm"
                  disabled={!result || busy}
                  onClick={() => {
                    downloadBlob(result.blob, filename);
                    onToast(`${filename} 저장됨`);
                  }}
                >
                  <Icon name="download" size={13} />
                  내려받기
                </button>
              </div>
            </div>
          )}

          <p className="hint">
            원본을 목표 픽셀로 다시 그려 저장합니다. <b>애니메이션은 유지되지 않고 정지 이미지 한 장</b>
            으로 저장됩니다 — 움직임을 살리려면 원본 툴(AE·Lottie)에서 작은 크기로 다시 내보내세요.
          </p>
        </div>
      );
    }

    /**

     */
    function IconGrid({
      names,
      assets,
      size,
      iconProps,
      pixelGrid,
      dimmed,
      selected,
      onSelect,
    }) {
      if (names.length + assets.length === 0) return null;

      /** 삭제한 아이콘 목록(숨김)을 볼 때는 흐리게 보여 준다 */
      const extra = `${pixelGrid ? ' pixelgrid' : ''}${dimmed ? ' dimmed' : ''}`;

      return (
        <div
          className="grid"
          style={{
            gridTemplateColumns: `repeat(auto-fill, minmax(${Math.max(104, size + 56)}px, 1fr))`,
          }}
        >
          {assets.map((item) => (
            <button
              key={item.url}
              className={`cell asset${extra}`}
              aria-selected={selected?.type === 'asset' && selected.item.url === item.url}
              onClick={() => onSelect({ type: 'asset', item })}
              title={`${item.file} — 클릭하면 상세 보기`}
            >
              <span className="glyph">
                <img
                  src={item.url}
                  alt=""
                  width={size}
                  height={size}
                  style={{ width: size, height: size, objectFit: 'contain' }}
                />
              </span>
              <span className="name">{item.name}</span>
            </button>
          ))}

          {names.map((name) => (
            <button
              key={name}
              className={`cell${extra}`}
              aria-selected={selected?.type === 'icon' && selected.name === name}
              onClick={() => onSelect({ type: 'icon', name })}
              title={`${name} — 클릭하면 상세 보기`}
            >
              <span className="glyph">
                <Icon name={name} {...iconProps} spin={name === 'loader'} />
              </span>
              <span className="name">{name}</span>
            </button>
          ))}
        </div>
      );
    }

    /* ───── src/app/App.jsx ───── */
    /**
     * 아이콘 컴포넌트 테스터 — 앱 셸
     * 상태(검색·툴바·선택·에셋)를 들고 components/ 의 조각들을 조립한다.
     */
    function App() {
      const [theme, toggleTheme] = useTheme();
      const [toast, showToast] = useToast();
      const { customTags, addTags, removeTag, dropTags } = useCustomTags(showToast);
      const { customCategories, moveCategory, resetCategory, dropCategory } =
        useCustomCategories(showToast);
      const { customIcons, addIcon, removeIcon } = useCustomIcons(showToast);
      const { hidden, hide, restore, restoreAll, hideCategory, restoreCategories } =
        useHiddenIcons(showToast);
      const { labels, setLabel, dropLabel } = useAssetLabels(showToast);

      const [query, setQuery] = useState('');
      const [category, setCategory] = useState('전체');
      const [size, setSize] = useState(DEFAULTS.size);
      const [strokeWidth, setStrokeWidth] = useState(DEFAULTS.strokeWidth);
      const [color, setColor] = useState(DEFAULTS.color);
      const [customColor, setCustomColor] = useState('#4f46e5');
      const [pixelGrid, setPixelGrid] = useState(false);
      const [selected, setSelected] = useState(null); // { type: 'icon' | 'asset', ... }
      const [extraAssets, setExtraAssets] = useState([]);
      const [dragging, setDragging] = useState(false);
      const [adding, setAdding] = useState(false);

      const searchRef = useRef(null);
      const dragDepth = useRef(0);

      /* 단축키: "/" 검색 포커스, Esc 패널 닫기 (입력 중에는 방해하지 않음) */
      useEffect(() => {
        const onKey = (e) => {
          const el = document.activeElement;
          const typing =
            el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);

          if (e.key === '/' && !typing) {
            e.preventDefault();
            searchRef.current?.focus();
            return;
          }
          if (e.key === 'Escape') {
            if (typing && el !== searchRef.current) el.blur();
            else if (adding) setAdding(false);
            else if (selected) setSelected(null);
            else if (el === searchRef.current) el.blur();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [selected, adding]);

      const copy = useCallback(
        (text, label) => {
          copyText(text);
          showToast(`${label} 복사됨`);
        },
        [showToast]
      );

      /**
       * 아이콘 이름 바꾸기
       *
       * 이름은 곧 아이콘을 찾는 키라서, 새 이름으로 등록한 뒤 옛 이름을 정리하는 방식으로 처리한다.
       * - 화면에서 추가한 아이콘 : 옛 항목을 지운다
       * - 기본 아이콘           : icons.js 는 고칠 수 없으므로 원본을 숨기고 새 이름으로 등록한다
       *                          (숨김에서 언제든 원래 아이콘을 되살릴 수 있다)
       * 붙여 둔 태그와 옮겨 둔 분류도 새 이름으로 따라간다.
       */
      const renameIcon = useCallback(
        (oldName, newName) => {
          const def = lookupIcon(oldName);
          if (!def || oldName === newName) return;

          const wasCustom = !!customIcons[oldName];
          const tags = [...new Set([...(def.tags || []), ...(customTags[oldName] || [])])];

          const category = iconCategory(oldName, customCategories);

          // 옛 이름 정리를 먼저 — 알림이 이름 변경 메시지로 끝나도록
          dropTags(oldName);
          dropCategory(oldName);
          if (wasCustom) removeIcon(oldName);
          else hide(oldName, oldName);

          addIcon(
            newName,
            { category, tags, body: def.body, scale: def.scale, custom: true },
            `이름을 ‘${newName}’ 로 바꿨습니다`
          );

          setSelected({ type: 'icon', name: newName });
        },
        [customIcons, customTags, customCategories, addIcon, removeIcon, hide, dropTags, dropCategory]
      );

      /**
       * 아이콘을 완전히 지울 때 딸린 기록도 함께 치운다.
       * 남겨 두면 저장소에 쓸모없는 행이 쌓이고, 나중에 같은 이름으로 아이콘을
       * 추가했을 때 옛 태그·분류를 물려받는다.
       */
      const forgetIconData = useCallback(
        (key) => {
          dropTags(key);
          dropCategory(key);
          dropLabel(key);
        },
        [dropTags, dropCategory, dropLabel]
      );

      const resetControls = useCallback(() => {
        setSize(DEFAULTS.size);
        setStrokeWidth(DEFAULTS.strokeWidth);
        setColor(DEFAULTS.color);
        setPixelGrid(false);
      }, []);

      /* ── cafe On : 사용자 이미지 아이콘 ───────── */
      /** 바꾼 라벨을 입혀 둔다 — 목록·검색·코드 조각·내보내기 파일명이 모두 이 이름을 쓴다 */
      const assets = useMemo(() => {
        const all = [...ANIMATED_ICONS, ...extraAssets];
        return all.map((a) => {
          const label = labels[assetKey(a)];
          return label ? { ...a, name: label } : a;
        });
      }, [extraAssets, labels]);

      /** 라벨을 바꾸면 객체가 새로 만들어지므로, 열려 있는 패널은 최신 것을 다시 찾아 쓴다 */
      const selectedAsset = useMemo(
        () =>
          selected?.type === 'asset'
            ? assets.find((a) => a.url === selected.item.url) || selected.item
            : null,
        [selected, assets]
      );

      const addFiles = useCallback(
        (fileList) => {
          const added = [...(fileList || [])]
            .filter((f) => f.type.startsWith('image/') || IMAGE_EXT.test(f.name))
            .map((f) => ({
              name: f.name.replace(/\.[^.]+$/, ''),
              file: f.name,
              url: URL.createObjectURL(f),
              blob: f,
              dropped: true,
            }));
          if (!added.length) {
            showToast('이미지 파일만 추가할 수 있습니다');
            return;
          }
          setExtraAssets((prev) => [...prev, ...added]);
          setCategory(CAFE);
          showToast(`${added.length}개 파일 추가됨`);
        },
        [showToast]
      );

      /* url 은 에셋마다 고유하다 — 라벨을 바꾸면 객체가 새로 생기므로 참조 대신 url 로 비교한다 */
      const removeAsset = useCallback((item) => {
        setExtraAssets((prev) => prev.filter((x) => x.url !== item.url));
        if (item.url?.startsWith('blob:')) URL.revokeObjectURL(item.url);
        setSelected((s) => (s?.type === 'asset' && s.item.url === item.url ? null : s));
      }, []);

      /* 페이지 어디에 놓아도 파일이 추가되도록 */
      const dropHandlers = {
        onDragEnter: (e) => {
          if (![...e.dataTransfer.types].includes('Files')) return;
          dragDepth.current += 1;
          setDragging(true);
        },
        onDragOver: (e) => {
          if ([...e.dataTransfer.types].includes('Files')) e.preventDefault();
        },
        onDragLeave: () => {
          dragDepth.current = Math.max(0, dragDepth.current - 1);
          if (dragDepth.current === 0) setDragging(false);
        },
        onDrop: (e) => {
          e.preventDefault();
          dragDepth.current = 0;
          setDragging(false);
          addFiles(e.dataTransfer.files);
        },
      };

      /**
       * 기본 아이콘 + 화면에서 추가한 아이콘.
       * 추가 대화상자가 중복 이름을 막지만, 저장된 값이 기본 아이콘과 겹칠 수도 있으므로
       * 한 번 더 걸러 같은 이름이 두 칸 나오지 않게 한다 (기본 아이콘이 우선).
       */
      const allNames = useMemo(
        () => [...new Set([...ALL_NAMES, ...Object.keys(customIcons)])].sort(),
        [customIcons]
      );

      /**
       * 검색 + 분류 필터
       * 분류는 사용자가 옮긴 값을 우선 적용하고, 삭제한 아이콘은 '숨김' 에서만 보인다.
       */
      const results = useMemo(() => {
        const q = query.trim().toLowerCase();
        return allNames.filter((name) => {
          const icon = lookupIcon(name);
          const cat = iconCategory(name, customCategories);
          if (category === HIDDEN) {
            if (!hidden[name]) return false;
          } else if (hidden[name]) return false;
          else if (category !== '전체' && cat !== category) return false;
          if (!q) return true;
          return (
            name.includes(q) ||
            cat.toLowerCase().includes(q) ||
            icon.tags.some((t) => t.toLowerCase().includes(q)) ||
            (customTags[name] || []).some((t) => t.toLowerCase().includes(q))
          );
        });
      }, [query, category, allNames, customTags, customCategories, hidden]);

      const assetResults = useMemo(() => {
        const q = query.trim().toLowerCase();
        return assets.filter((a) => {
          const key = assetKey(a);
          const cat = assetCategory(a, customCategories, CAFE);
          if (category === HIDDEN) {
            if (!hidden[key]) return false;
          } else if (hidden[key]) return false;
          else if (category !== '전체' && cat !== category) return false;
          if (!q) return true;
          return (
            a.name.toLowerCase().includes(q) ||
            a.file.toLowerCase().includes(q) ||
            cat.toLowerCase().includes(q) ||
            (customTags[key] || []).some((t) => t.toLowerCase().includes(q))
          );
        });
      }, [query, category, assets, customTags, customCategories, hidden]);

      const total = results.length + assetResults.length;

      /* 개수 집계 — 삭제한 아이콘은 빼고 센다 */
      const counts = useMemo(() => {
        const visibleNames = allNames.filter((n) => !hidden[n]);
        const visibleAssets = assets.filter((a) => !hidden[assetKey(a)]);
        const map = { 전체: visibleNames.length + visibleAssets.length, [CAFE]: 0 };
        const bump = (c) => {
          map[c] = (map[c] || 0) + 1;
        };
        for (const n of visibleNames) bump(iconCategory(n, customCategories));
        for (const a of visibleAssets) bump(assetCategory(a, customCategories, CAFE));
        return map;
      }, [allNames, assets, customCategories, hidden]);

      /** 삭제한 아이콘 수 — 지금 목록에 실제로 존재하는 것만 센다 */
      const hiddenCount = useMemo(
        () =>
          allNames.filter((n) => hidden[n]).length +
          assets.filter((a) => hidden[assetKey(a)]).length,
        [allNames, assets, hidden]
      );

      /**
       * 기본 분류 + 사용자가 새로 만든 분류.
       * 소속된 아이콘이 하나도 없는 분류는 빼서 빈 칩이 남지 않게 한다
       * (마지막 아이콘을 다른 곳으로 옮기면 그 분류는 자동으로 사라진다)
       */
      const categoryList = useMemo(() => {
        const extra = Object.keys(counts).filter(
          (c) => c !== '전체' && c !== CAFE && !CATEGORIES.includes(c) && counts[c] > 0
        );
        return [...CATEGORIES, ...extra].filter((c) => !hidden[categoryKey(c)]);
      }, [counts, hidden]);

      /* 상세 패널의 분류 선택 목록 — cafe On 도 이동 대상에 포함 */
      const pickerCategories = useMemo(() => [...categoryList, CAFE], [categoryList]);

      /** 지운 분류가 하나라도 있으면 되살리기 칩을 보여 준다 */
      const hasHiddenCategories = useMemo(
        () => Object.keys(hidden).some((k) => k.startsWith('#')),
        [hidden]
      );

      /**
       * 분류 칩 삭제 — 아이콘은 그대로 두고 상단 필터에서만 감춘다.
       * 지금 그 분류를 보고 있었다면 전체로 되돌린다.
       */
      const deleteCategory = useCallback(
        (name) => {
          if (name === FALLBACK_CATEGORY) return;
          hideCategory(name);
          setCategory((cur) => (cur === name ? '전체' : cur));
        },
        [hideCategory]
      );

      /* 삭제한 아이콘을 모두 복원하면 '숨김' 화면에 머물 이유가 없다 */
      useEffect(() => {
        if (category === HIDDEN && hiddenCount === 0) setCategory('전체');
      }, [category, hiddenCount]);

      return (
        <div className={`app${dragging ? ' dropping' : ''}`} {...dropHandlers}>
          {dragging && <DropOverlay />}

          <Masthead
            count={allNames.filter((n) => !hidden[n]).length}
            theme={theme}
            onToggleTheme={toggleTheme}
          />

          <Toolbar
            searchRef={searchRef}
            query={query}
            onQuery={setQuery}
            size={size}
            onSize={setSize}
            strokeWidth={strokeWidth}
            onStrokeWidth={setStrokeWidth}
            color={color}
            onColor={setColor}
            customColor={customColor}
            onCustomColor={setCustomColor}
            pixelGrid={pixelGrid}
            onPixelGrid={setPixelGrid}
            onReset={resetControls}
            category={category}
            onCategory={setCategory}
            categories={categoryList}
            onDeleteCategory={deleteCategory}
            hasHiddenCategories={hasHiddenCategories}
            onRestoreCategories={restoreCategories}
            counts={counts}
            onAddFiles={addFiles}
            onAddSvg={() => setAdding(true)}
            hiddenCount={hiddenCount}
          />

          <div className="result-line">
            <b>{total}</b>
            <span>개 표시 중</span>
            {assetResults.length > 0 && <span>· 이미지 아이콘 {assetResults.length}개 포함</span>}
            {query && <span>· 검색어 “{query}”</span>}
            {category === HIDDEN ? (
              <>
                <button className="link-btn" onClick={restoreAll}>
                  <Icon name="refresh" size={12} />
                  모두 복원
                </button>
                <span style={{ marginLeft: 'auto' }}>
                  아이콘을 클릭하면 하나씩 복원할 수 있습니다
                </span>
              </>
            ) : (
              <span style={{ marginLeft: 'auto' }}>아이콘을 클릭하면 코드를 복사할 수 있습니다</span>
            )}
          </div>

          {total === 0 ? (
            <EmptyState category={category} query={query} />
          ) : (
            <IconGrid
              names={results}
              assets={assetResults}
              size={size}
              iconProps={{ size, strokeWidth, color }}
              pixelGrid={pixelGrid}
              dimmed={category === HIDDEN}
              selected={selected}
              onSelect={setSelected}
            />
          )}

          {selected?.type === 'icon' && (
            <DetailPanel
              name={selected.name}
              size={size}
              strokeWidth={strokeWidth}
              color={color}
              category={iconCategory(selected.name, customCategories)}
              categories={pickerCategories}
              onMoveCategory={(c) => moveCategory(selected.name, c, lookupIcon(selected.name).category)}
              onResetCategory={() => resetCategory(selected.name, lookupIcon(selected.name).category)}
              customTags={customTags[selected.name] || []}
              onAddTags={(raw) => addTags(selected.name, raw)}
              onRemoveTag={(tag) => removeTag(selected.name, tag)}
              onClose={() => setSelected(null)}
              onCopy={copy}
              hidden={!!hidden[selected.name]}
              permanent={!!customIcons[selected.name]}
              onDelete={() => {
                if (customIcons[selected.name]) {
                  removeIcon(selected.name);
                  forgetIconData(selected.name);
                } else hide(selected.name, selected.name);
                setSelected(null);
              }}
              onRestore={() => {
                restore(selected.name, selected.name);
                setSelected(null);
              }}
              existingNames={allNames}
              onRename={(next) => renameIcon(selected.name, next)}
            />
          )}
          {selected?.type === 'asset' && (
            <AssetPanel
              item={selectedAsset}
              size={size}
              strokeWidth={strokeWidth}
              category={assetCategory(selectedAsset, customCategories, CAFE)}
              categories={pickerCategories}
              onMoveCategory={(c) => moveCategory(assetKey(selectedAsset), c, CAFE)}
              onResetCategory={() => resetCategory(assetKey(selectedAsset), CAFE)}
              customTags={customTags[assetKey(selectedAsset)] || []}
              onAddTags={(raw) => addTags(assetKey(selectedAsset), raw)}
              onRemoveTag={(tag) => removeTag(assetKey(selectedAsset), tag)}
              onClose={() => setSelected(null)}
              onCopy={copy}
              onToast={showToast}
              hidden={!!hidden[assetKey(selectedAsset)]}
              onDelete={() => {
                if (selectedAsset.dropped) {
                  removeAsset(selectedAsset);
                  forgetIconData(assetKey(selectedAsset));
                } else hide(assetKey(selectedAsset), selectedAsset.file);
                setSelected(null);
              }}
              onRestore={() => {
                restore(assetKey(selectedAsset), selectedAsset.file);
                setSelected(null);
              }}
              existingNames={assets.filter((a) => a.url !== selectedAsset.url).map((a) => a.name)}
              onRename={(next) =>
                setLabel(assetKey(selectedAsset), next, selectedAsset.file.replace(/\.[^.]+$/, ''))
              }
            />
          )}

          {adding && (
            <AddIconDialog
              categories={pickerCategories}
              strokeWidth={strokeWidth}
              color={color}
              existingNames={allNames}
              onAdd={addIcon}
              onClose={() => setAdding(false)}
              onCopy={copy}
            />
          )}

          <Toast message={toast} />
        </div>
      );
    }

    /* ───── src/app/main.jsx 대체 ───── */
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
