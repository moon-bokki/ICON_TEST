  <div id="root"></div>

  <!-- ⚠ 이 파일은 build-standalone.js 가 생성합니다. 직접 수정하지 마세요.

          'border-radius:12px;font-family:sans-serif;line-height:1.7">' +

          '내려받습니다. 인터넷 연결을 확인하거나, 사내망이라면 <code>npm install &amp;&amp; npm run dev</code> ' +
          '로 Vite 버전을 실행해 주세요.</p></div>';
      }
    });
  </script>

  <script type="text/babel" data-presets="react">
    const { forwardRef, useCallback, useEffect, useMemo, useRef, useState } = React;
    const ICONS = window.ICONS;

    /* ───── icon/ 폴더 에셋 (빌드 시점에 주입) ───── */
    const ANIMATED_ICONS = [
          {
                "name": "home",
                "file": "home.gif",
                "url": "icon/home.gif"
          },
          {
                "name": "map",
                "file": "map.gif",
                "url": "icon/map.gif"
          },
          {
                "name": "profile",
                "file": "profile.gif",
                "url": "icon/profile.gif"
          },
          {
                "name": "serch",
                "file": "serch.gif",

          },
          {
                "name": "serch02",
                "file": "serch02.gif",

          },
          {
                "name": "setting",

                "url": "icon/setting.gif"
          }
    ];

    /* ───── src/Icon.jsx ───── */
    /**
     * 아이콘 컴포넌트
     *
     * @example
     * <Icon name="search" />
     * <Icon name="loader" size={20} spin />
     * <Icon name="trash" color="#dc2626" strokeWidth={2} title="삭제" />
     *
     * props
     *  - name        : 아이콘 이름 (필수)
     *  - size        : px 크기 (기본 24). CSS 로 제어하려면 size="1em"
     *  - strokeWidth : 선 두께 (기본 1.75)
     *  - color       : 색상 (기본 currentColor — 부모 글자색을 따라감)
     *  - title       : 지정하면 의미 있는 이미지(role="img")로, 없으면 장식용(aria-hidden)
     *  - spin        : 회전 애니메이션
     *  - pulse       : 깜빡임 애니메이션
     *  - rotate      : 회전 각도 (deg)
     *  - flip        : 'x' | 'y' | 'xy'
     *  - absoluteStrokeWidth : true 면 크기가 변해도 선 두께를 24px 기준으로 고정
     */
    const Icon = forwardRef(function Icon(
      {
        name,
        size = 24,
        strokeWidth = 1.75,
        color = 'currentColor',
        title,
        spin = false,
        pulse = false,
        rotate = 0,
        flip,
        absoluteStrokeWidth = false,
        className = '',
        style,
        ...rest
      },
      ref
    ) {
      const icon = ICONS[name];

      const transform = useMemo(() => {
        const t = [];
        if (rotate) t.push(`rotate(${rotate}deg)`);
        if (flip === 'x' || flip === 'xy') t.push('scaleX(-1)');
        if (flip === 'y' || flip === 'xy') t.push('scaleY(-1)');
        return t.length ? t.join(' ') : undefined;
      }, [rotate, flip]);

      if (!icon) {
        console.warn(`[Icon] "${name}" 아이콘을 찾을 수 없습니다.`);
        return null;
      }

      const numeric = typeof size === 'number' || /^\d+(\.\d+)?$/.test(String(size));
      const px = numeric ? Number(size) : null;
      const sw = absoluteStrokeWidth && px ? (strokeWidth * 24) / px : strokeWidth;

      const cls = ['ui-icon', spin && 'ui-icon-spin', pulse && 'ui-icon-pulse', className]
        .filter(Boolean)
        .join(' ');

      return (
        <svg
          ref={ref}
          className={cls}
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width={px ?? size}
          height={px ?? size}
          fill="none"
          stroke={color}
          strokeWidth={sw}
          strokeLinecap="round"
          strokeLinejoin="round"
          role={title ? 'img' : undefined}
          aria-hidden={title ? undefined : true}
          focusable="false"
          style={{ display: 'block', flex: 'none', transform, ...style }}
          dangerouslySetInnerHTML={{
            __html: (title ? `<title>${escapeXml(title)}</title>` : '') + icon.body,
          }}
          {...rest}
        />
      );
    });

    function escapeXml(s) {
      return String(s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
    }

    /** 아이콘 하나를 독립 실행 가능한 SVG 문자열로 반환 */
    function toSvgString(name, { size = 24, strokeWidth = 1.75, color = 'currentColor' } = {}) {
      const icon = ICONS[name];
      if (!icon) return '';
      return (
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" ` +
        `fill="none" stroke="${color}" stroke-width="${strokeWidth}" ` +
        `stroke-linecap="round" stroke-linejoin="round">` +
        icon.body.replace(/\/><path/g, '/>\n  <path').replace(/^</, '\n  <') +
        `\n</svg>`
      );
    }

    /* ───── src/AnimatedIconLab.jsx ───── */
    const SIZE_LADDER = [16, 20, 24, 32, 48, 64, 96, 128];

    const BACKGROUNDS = [
      { id: 'checker', label: '투명(체커)' },
      { id: 'white', label: '흰색' },
      { id: 'gray', label: '회색' },
      { id: 'dark', label: '검정' },
      { id: 'brand', label: '브랜드' },
      { id: 'photo', label: '사진' },
    ];

    /* ══════════════════════════════════════════
       GIF 헤더 파서
       해상도 · 프레임 수 · 재생 시간 · 반복 · 투명도
       ══════════════════════════════════════════ */
    function skipSubBlocks(b, p) {
      while (p < b.length && b[p] !== 0) p += b[p] + 1;
      return p + 1;
    }

    function parseGif(buffer) {
      const b = new Uint8Array(buffer);
      const dv = new DataView(buffer);
      // 헤더(13바이트)조차 없으면 GIF 가 아니거나 잘린 파일
      if (b.length < 13) return null;
      if (String.fromCharCode(b[0], b[1], b[2]) !== 'GIF') return null;

      /** 범위를 벗어난 읽기는 0 으로 (잘린 파일 방어) */
      const u16 = (o) => (o + 1 < b.length ? dv.getUint16(o, true) : 0);

      const width = u16(6);
      const height = u16(8);
      const packed = b[10];

      const hasGlobalPalette = !!(packed & 0x80);
      let p = 13;
      if (hasGlobalPalette) p += 3 * (1 << ((packed & 7) + 1)); // 전역 색상표 건너뛰기

      let frames = 0;
      let durationMs = 0;
      let transparent = false;
      let loops = null;
      let localPalettes = 0;
      let guard = 0;

      while (p < b.length && guard++ < 200000) {
        const marker = b[p];

        if (marker === 0x3b) break; // trailer

        if (marker === 0x21) {
          const label = b[p + 1];
          p += 2;
          if (label === 0xf9) {
            // Graphic Control Extension
            const size = b[p];
            const gce = b[p + 1];
            const delay = u16(p + 2);
            if (gce & 1) transparent = true;
            // 브라우저는 delay < 2 를 10(=100ms)으로 보정한다
            durationMs += (delay < 2 ? 10 : delay) * 10;
            p = skipSubBlocks(b, p + size + 1);
          } else if (label === 0xff) {
            // Application Extension (NETSCAPE 반복 횟수)
            const size = b[p];
            const app = String.fromCharCode(...b.slice(p + 1, p + 12));
            const q = p + 1 + size;
            if (app.startsWith('NETSCAPE') && b[q] >= 3) loops = u16(q + 2);
            p = skipSubBlocks(b, q);
          } else if (label === 0xfe) {
            p = skipSubBlocks(b, p); // Comment
          } else {
            p = skipSubBlocks(b, p + 1 + b[p]); // Plain Text 등
          }
        } else if (marker === 0x2c) {
          // Image Descriptor
          frames++;
          const lpacked = b[p + 9];
          p += 10;
          if (lpacked & 0x80) {
            localPalettes++;
            p += 3 * (1 << ((lpacked & 7) + 1)); // 지역 색상표
          }
          p += 1; // LZW 최소 코드 크기
          p = skipSubBlocks(b, p);
        } else {
          p++;
        }
      }

      return {
        format: 'GIF',
        width,
        height,
        frames,
        durationMs,
        loops, // 0 = 무한
        transparent,
        // 프레임이 지역 팔레트를 쓰면 색상은 프레임마다 따로 정해진다
        localPalettes,
        colors: hasGlobalPalette ? 1 << ((packed & 7) + 1) : null,
      };
    }

    /* ══════════════════════════════════════════
       에셋 로더
       fetch 로 원본을 읽어 메타데이터 + Blob URL 확보.
       file:// 로 열었을 때는 fetch 가 막히므로 <img> 직접 로드로 폴백.
       ══════════════════════════════════════════ */
    function useAsset(src, initialBlob) {
      const [state, setState] = useState({ status: 'loading', url: src, meta: null, bytes: null });
      const blobRef = useRef(initialBlob || null);
      const urlRef = useRef(null);

      useEffect(() => {
        let alive = true;

        async function load() {
          // 드롭된 파일은 이미 Blob 을 가지고 있다
          if (blobRef.current) {
            const buf = await blobRef.current.arrayBuffer();
            if (!alive) return;
            const url = URL.createObjectURL(blobRef.current);
            urlRef.current = url;
            setState({
              status: 'ok',
              url,
              bytes: blobRef.current.size,
              meta: parseGif(buf),
            });
            return;
          }

          try {
            const res = await fetch(src);
            if (!res.ok) throw new Error(String(res.status));
            const buf = await res.arrayBuffer();
            if (!alive) return;
            const blob = new Blob([buf]);
            blobRef.current = blob;
            const url = URL.createObjectURL(blob);
            urlRef.current = url;
            setState({ status: 'ok', url, bytes: buf.byteLength, meta: parseGif(buf) });
          } catch {
            // file:// 등 — 이미지 자체는 표시되지만 메타데이터는 못 읽는다
            if (alive) setState({ status: 'limited', url: src, meta: null, bytes: null });
          }
        }

        load();
        return () => {
          alive = false;
          if (urlRef.current) URL.revokeObjectURL(urlRef.current);
        };
      }, [src]);

      /** 애니메이션 처음부터 다시 재생 */
      const restart = useCallback(() => {
        setState((s) => {
          if (blobRef.current) {
            if (urlRef.current) URL.revokeObjectURL(urlRef.current);
            const url = URL.createObjectURL(blobRef.current);
            urlRef.current = url;
            return { ...s, url };
          }
          const base = src.split('?')[0];
          return { ...s, url: `${base}?r=${Date.now()}` };
        });
      }, [src]);

      return [state, restart];
    }

    /* ══════════════════════════════════════════
       실제 픽셀 크기로 다시 렌더링 (리사이즈 · 내보내기)
       640px 원본을 24px 로 "표시"만 하는 게 아니라
       진짜 24px 이미지로 만들어 준다.
       ══════════════════════════════════════════ */
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('이미지를 불러오지 못했습니다'));
        img.src = url;
      });
    }

    /**
     * @param url   원본 이미지 URL (blob: 권장 — file:// 경로는 캔버스가 오염된다)
     * @param px    출력할 정사각형 픽셀 크기
     * @param type  'image/png' | 'image/webp'
     * @returns {Promise<Blob>}
     */
    async function renderAtSize(url, px, type = 'image/png') {
      const img = await loadImage(url);
      const canvas = document.createElement('canvas');
      canvas.width = px;
      canvas.height = px;

      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 비율을 유지한 채 정사각형 캔버스 가운데 배치
      const w = img.naturalWidth || px;
      const h = img.naturalHeight || px;
      const ratio = Math.min(px / w, px / h);
      const dw = Math.max(1, Math.round(w * ratio));
      const dh = Math.max(1, Math.round(h * ratio));
      ctx.drawImage(img, Math.round((px - dw) / 2), Math.round((px - dh) / 2), dw, dh);

      return new Promise((resolve, reject) => {
        try {
          canvas.toBlob(
            (blob) => (blob ? resolve(blob) : reject(new Error('이미지를 만들지 못했습니다'))),
            type
          );
        } catch {
          // 캔버스 오염(file:// 에서 흔함)
          reject(new Error('보안 정책 때문에 이 이미지를 변환할 수 없습니다'));
        }
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* ══════════════════════════════════════════
       메인
       ══════════════════════════════════════════ */
    function AnimatedIconLab({ strokeWidth = 1.75, items = [], onAddFiles, onRemove }) {
      const [bg, setBg] = useState('checker');
      const [restartSignal, setRestartSignal] = useState(0);
      const inputRef = useRef(null);

      return (
        <section className="lab anim-lab" id="cafe-on-lab">
          <h2>컬러 · 애니메이션 아이콘</h2>
          <p className="lead">
            GIF·APNG·WebP·SVG 같은 컬러 아이콘은 라인 아이콘과 점검 항목이 다릅니다. 축소했을 때의
            가독성, 배경 투명도, 파일 용량, 프레임 수를 함께 확인하세요.
          </p>

          <div className="anim-toolbar">
            <div className="seg" role="group" aria-label="미리보기 배경">
              {BACKGROUNDS.map((b) => (
                <button
                  key={b.id}
                  className="seg-btn"
                  aria-pressed={bg === b.id}
                  onClick={() => setBg(b.id)}
                >
                  {b.label}
                </button>
              ))}
            </div>

            <div className="spacer" />

            <button className="demo-btn sm" onClick={() => setRestartSignal((n) => n + 1)}>
              <Icon name="refresh" size={14} strokeWidth={strokeWidth} />
              전체 다시 재생
            </button>
            <button className="demo-btn sm" onClick={() => inputRef.current?.click()}>
              <Icon name="upload" size={14} strokeWidth={strokeWidth} />
              파일 추가
            </button>
            <input
              ref={inputRef}
              type="file"
              accept="image/*"
              multiple
              hidden
              onChange={(e) => {
                onAddFiles?.(e.target.files);
                e.target.value = '';
              }}
            />
          </div>

          {items.length === 0 ? (
            <div className="dropzone">
              <Icon name="image" size={28} strokeWidth={strokeWidth} />
              <div className="big">테스트할 아이콘 파일을 여기에 끌어다 놓으세요</div>
              <div>GIF · APNG · WebP · SVG · PNG — 또는 icon/ 폴더에 넣으면 자동으로 나타납니다</div>
            </div>
          ) : (
            <div className="anim-grid">
              {items.map((item) => (
                <AssetCard
                  key={item.url + item.name}
                  item={item}
                  bg={bg}
                  strokeWidth={strokeWidth}
                  restartSignal={restartSignal}
                  onRemove={item.dropped ? () => onRemove?.(item) : undefined}
                />
              ))}
            </div>
          )}

          <p className="hint" style={{ marginTop: 14 }}>
            페이지 아무 곳에나 파일을 드래그하면 즉시 추가로 테스트할 수 있습니다. 드롭한 파일은
            브라우저 안에서만 사용되며 어디에도 업로드되지 않습니다.
          </p>
        </section>
      );
    }

    /* ══════════════════════════════════════════
       에셋 카드
       ══════════════════════════════════════════ */
    function AssetCard({ item, bg, strokeWidth, restartSignal, onRemove }) {
      const [{ status, url, meta, bytes }, restart] = useAsset(item.url, item.blob);
      const [natural, setNatural] = useState(null);
      const [alpha, setAlpha] = useState(null); // true = 투명 배경 있음
      const [frameShot, setFrameShot] = useState(null);
      const [captureError, setCaptureError] = useState(false);
      const imgRef = useRef(null);
      const first = useRef(true);

      /* 전체 다시 재생 신호 */
      useEffect(() => {
        if (first.current) {
          first.current = false;
          return;
        }
        restart();
      }, [restartSignal, restart]);

      /* 모서리 픽셀의 알파값으로 투명 배경 여부 판정 */
      const onLoad = (e) => {
        const img = e.currentTarget;
        setNatural({ w: img.naturalWidth, h: img.naturalHeight });
        if (alpha !== null) return;
        try {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth;
          c.height = img.naturalHeight;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          const { width: w, height: h } = c;
          const pts = [
            [1, 1],
            [w - 2, 1],
            [1, h - 2],
            [w - 2, h - 2],
          ];
          const transparentCorners = pts.filter(
            ([x, y]) => ctx.getImageData(x, y, 1, 1).data[3] < 16
          ).length;
          setAlpha(transparentCorners >= 3);
        } catch {
          setAlpha(meta ? meta.transparent : null); // 캔버스가 오염된 경우 GIF 플래그로 대체
        }
      };

      const capture = () => {
        const img = imgRef.current;
        if (!img) return;
        try {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth;
          c.height = img.naturalHeight;
          c.getContext('2d').drawImage(img, 0, 0);
          setFrameShot(c.toDataURL('image/png'));
          setCaptureError(false);
        } catch {
          setCaptureError(true);
        }
      };

      const ext = (item.file.match(/\.([^.]+)$/)?.[1] || '').toUpperCase();
      const transparent = alpha ?? meta?.transparent ?? null;
      const issues = diagnose({ bytes, meta, natural, transparent, ext });
      const twin = useMemo(() => findLineTwin(item.name), [item.name]);

      return (
        <div className="card anim-card">
          <div className="anim-head">
            <span className="anim-name">{item.file}</span>
            <span className="tag">{ext || '?'}</span>
            {item.dropped && <span className="tag">드롭됨</span>}
            <span className="spacer" />
            {onRemove && (
              <button className="icon-btn sm" onClick={onRemove} aria-label="목록에서 제거">
                <Icon name="x" size={14} strokeWidth={strokeWidth} />
              </button>
            )}
          </div>

          {/* 크기별 렌더링 */}
          <div className={`anim-stage bg-${bg}`}>
            <div className="ladder">
              {SIZE_LADDER.map((s, i) => (

              보려면 이 카드에 파일을 드래그해 넣거나 <code>npm run dev</code> 로 실행하세요.
            </p>

          {/* 실제 UI 안에서 */}
          <div className="section-label">실제 UI 안에서</div>
          <div className="demo-row" style={{ marginBottom: 10 }}>
            <button className="demo-btn">

            </button>
            <button className="demo-btn primary">
              <img src={url} alt="" width={16} height={16} style={{ objectFit: 'contain' }} />
              버튼 안 16px
            </button>
            <span className="badge ok">

              <div className="twin-row">
                {[16, 24, 32, 48].map((s) => (
                  <div className="twin" key={s}>
                    <div className="twin-pair">

                      <Icon name={twin} size={s} strokeWidth={strokeWidth} />

                <div className="twin-note">

                  비교해 보세요.
                </div>
              </div>
            </>
          )}
        </div>

    }

    /* ══════════════════════════════════════════
       유틸
       ══════════════════════════════════════════ */
    function formatBytes(n) {
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1024 / 1024).toFixed(2)} MB`;
    }

    function diagnose({ bytes, meta, natural, transparent, ext }) {
      const out = [];

      if (bytes != null) {
        if (bytes > 500 * 1024)
          out.push({
            level: 'err',
            text: `${formatBytes(bytes)} — 아이콘 하나 용량으로 매우 큽니다. Lottie(JSON) 또는 애니메이션 WebP 로 바꾸면 보통 20~50배 줄어듭니다.`,
          });
        else if (bytes > 100 * 1024)
          out.push({ level: 'warn', text: `${formatBytes(bytes)} — 아이콘치고 큰 편입니다.` });
      }

      if (natural && natural.w > 256)
        out.push({
          level: 'warn',
          text: `원본이 ${natural.w}px인데 실제로는 16~48px로 쓰입니다. 표시 크기의 2배(최대 96px)로 다시 내보내면 용량이 크게 줄어듭니다.`,
        });

      if (meta && meta.frames > 100)
        out.push({
          level: 'warn',
          text: `${meta.frames}프레임 — 프레임을 줄이거나(12~24fps) 재생 길이를 짧게 하면 가벼워집니다.`,
        });

      if (meta && meta.durationMs > 0) {
        const fps = meta.frames / (meta.durationMs / 1000);
        if (fps > 30)
          out.push({
            level: 'warn',
            text: `약 ${Math.round(fps)}fps — 작은 아이콘에서는 24fps 이하로도 차이를 느끼기 어렵습니다. 프레임을 절반으로 줄이면 용량도 대략 절반이 됩니다.`,
          });
      }

      if (transparent === false)
        out.push({
          level: 'err',
          text: '투명 배경이 아닙니다. 다크 모드나 색 배경 위에서 흰 사각형이 그대로 보입니다.',
        });

      if (ext === 'GIF')
        out.push({
          level: 'info',
          text: 'GIF는 256색 · 알파 1비트라 가장자리가 계단처럼 보일 수 있습니다. 부드러운 경계가 필요하면 WebP/Lottie 를 권장합니다.',
        });

      return out;
    }

    /** 이름이 비슷한 라인 아이콘 찾기 (serch → search 처럼 오타도 허용) */
    function findLineTwin(name) {
      const key = name.toLowerCase().replace(/[-_\s]/g, '');
      let best = null;
      let bestScore = 3; // 편집 거리 2 이하만 채택
      for (const n of Object.keys(ICONS)) {
        const d = editDistance(key, n.replace(/-/g, ''));
        if (d < bestScore) {
          bestScore = d;
          best = n;
        }
      }
      return best;
    }

    function editDistance(a, b) {
      if (Math.abs(a.length - b.length) > 2) return 99;
      const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
        }
      }
      return dp[a.length][b.length];
    }

    /* ───── src/IconTester.jsx ───── */
    const ALL_NAMES = Object.keys(ICONS).sort();
    const CATEGORIES = [...new Set(ALL_NAMES.map((n) => ICONS[n].category))];
    /** 사용자가 넣은 이미지 아이콘(icon/ 폴더 + 드래그해 추가한 파일) 묶음 이름 */
    const CAFE = 'cafe On';
    const IMAGE_EXT = /\.(gif|png|apng|webp|svg|avif|jpe?g)$/i;
    const SWATCHES = ['currentColor', '#4f46e5', '#0ea5e9', '#16a34a', '#f59e0b', '#dc2626'];
    const PREVIEW_SIZES = [12, 16, 20, 24, 32, 48, 64];

    /* ── 클립보드 복사 (file:// 환경 대비 폴백 포함) ── */
    function copyText(text) {
      if (navigator.clipboard?.writeText) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
      }
      return Promise.resolve(legacyCopy(text));
    }
    function legacyCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
      } finally {
        ta.remove();
      }
    }

    function IconTester() {
      const [theme, setTheme] = useState(() => localStorage.getItem('icon-tester-theme') || 'light');
      const [query, setQuery] = useState('');
      const [category, setCategory] = useState('전체');
      const [size, setSize] = useState(24);
      const [strokeWidth, setStrokeWidth] = useState(1.75);
      const [color, setColor] = useState('currentColor');
      const [customColor, setCustomColor] = useState('#4f46e5');
      const [pixelGrid, setPixelGrid] = useState(false);
      const [selected, setSelected] = useState(null); // { type: 'icon' | 'asset', ... }
      const [toast, setToast] = useState('');
      const [extraAssets, setExtraAssets] = useState([]);
      const [dragging, setDragging] = useState(false);
      const searchRef = useRef(null);
      const fileRef = useRef(null);
      const dragDepth = useRef(0);

      /* 테마 적용 */
      useEffect(() => {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('icon-tester-theme', theme);
      }, [theme]);

      /* 단축키: "/" 검색 포커스, Esc 패널 닫기 (입력 중에는 방해하지 않음) */
      useEffect(() => {
        const onKey = (e) => {
          const el = document.activeElement;
          const typing =
            el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);

          if (e.key === '/' && !typing) {
            e.preventDefault();
            searchRef.current?.focus();
            return;
          }
          if (e.key === 'Escape') {
            if (typing && el !== searchRef.current) el.blur();
            else if (selected) setSelected(null);
            else if (el === searchRef.current) el.blur();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [selected]);

      const showToast = useCallback((msg) => {
        setToast(msg);
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => setToast(''), 1600);
      }, []);

      const copy = useCallback(
        (text, label) => {
          copyText(text);
          showToast(`${label} 복사됨`);
        },
        [showToast]
      );

      /* ── 사용자 태그 ──────────────────────────
         ICONS 의 기본 태그에 덧붙이는 태그. localStorage 에 저장된다.
         키: 라인 아이콘은 아이콘 이름, 이미지 아이콘은 "@파일명"          */
      const [customTags, setCustomTags] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('icon-tester-tags') || '{}');
        } catch {
          return {};
        }
      });

      useEffect(() => {
        localStorage.setItem('icon-tester-tags', JSON.stringify(customTags));
      }, [customTags]);

      const addTags = useCallback(
        (key, raw) => {
          const builtin = ICONS[key]?.tags || [];
          const existing = customTags[key] || [];
          const fresh = [];
          for (const part of String(raw).split(/[,\n]+/)) {
            const tag = part.trim();
            if (!tag) continue;
            if (builtin.includes(tag) || existing.includes(tag) || fresh.includes(tag)) continue;
            fresh.push(tag);
          }
          if (!fresh.length) {
            showToast('이미 있는 태그입니다');
            return;
          }
          setCustomTags((prev) => ({ ...prev, [key]: [...(prev[key] || []), ...fresh] }));
          showToast(`태그 ${fresh.length}개 추가됨`);
        },
        [customTags, showToast]
      );

      const removeTag = useCallback((key, tag) => {
        setCustomTags((prev) => {
          const next = (prev[key] || []).filter((t) => t !== tag);
          const copy = { ...prev };
          if (next.length) copy[key] = next;
          else delete copy[key];
          return copy;
        });
      }, []);

      /* ── cafe On : 사용자 이미지 아이콘 ───────── */
      const assets = useMemo(() => [...ANIMATED_ICONS, ...extraAssets], [extraAssets]);

      const addFiles = useCallback(
        (fileList) => {
          const added = [...(fileList || [])]
            .filter((f) => f.type.startsWith('image/') || IMAGE_EXT.test(f.name))
            .map((f) => ({
              name: f.name.replace(/\.[^.]+$/, ''),
              file: f.name,
              url: URL.createObjectURL(f),
              blob: f,
              dropped: true,
            }));
          if (!added.length) {
            showToast('이미지 파일만 추가할 수 있습니다');
            return;
          }
          setExtraAssets((prev) => [...prev, ...added]);
          setCategory(CAFE);
          showToast(`${added.length}개 파일 추가됨`);
        },
        [showToast]
      );

      const removeAsset = useCallback((item) => {
        setExtraAssets((prev) => prev.filter((x) => x !== item));
        if (item.url?.startsWith('blob:')) URL.revokeObjectURL(item.url);
        setSelected((s) => (s?.type === 'asset' && s.item === item ? null : s));
      }, []);

      /* 페이지 어디에 놓아도 파일이 추가되도록 */
      const dropHandlers = {
        onDragEnter: (e) => {
          if (![...e.dataTransfer.types].includes('Files')) return;
          dragDepth.current += 1;
          setDragging(true);
        },
        onDragOver: (e) => {
          if ([...e.dataTransfer.types].includes('Files')) e.preventDefault();
        },
        onDragLeave: () => {
          dragDepth.current = Math.max(0, dragDepth.current - 1);
          if (dragDepth.current === 0) setDragging(false);
        },
        onDrop: (e) => {
          e.preventDefault();
          dragDepth.current = 0;
          setDragging(false);
          addFiles(e.dataTransfer.files);
        },
      };

      /* 검색 + 분류 필터 */
      const results = useMemo(() => {
        if (category === CAFE) return [];
        const q = query.trim().toLowerCase();
        return ALL_NAMES.filter((name) => {
          const icon = ICONS[name];
          if (category !== '전체' && icon.category !== category) return false;
          if (!q) return true;
          return (
            name.includes(q) ||
            icon.category.toLowerCase().includes(q) ||
            icon.tags.some((t) => t.toLowerCase().includes(q)) ||
            (customTags[name] || []).some((t) => t.toLowerCase().includes(q))
          );
        });
      }, [query, category, customTags]);

      const assetResults = useMemo(() => {
        if (category !== '전체' && category !== CAFE) return [];
        const q = query.trim().toLowerCase();
        if (!q) return assets;
        return assets.filter(
          (a) =>
            a.name.toLowerCase().includes(q) ||
            a.file.toLowerCase().includes(q) ||
            (customTags['@' + a.file] || []).some((t) => t.toLowerCase().includes(q))
        );
      }, [query, category, assets, customTags]);

      const total = results.length + assetResults.length;

      const counts = useMemo(() => {
        const map = { 전체: ALL_NAMES.length + assets.length, [CAFE]: assets.length };
        for (const n of ALL_NAMES) map[ICONS[n].category] = (map[ICONS[n].category] || 0) + 1;
        return map;
      }, [assets.length]);

      const iconProps = { size, strokeWidth, color };

      return (
        <div className={`app${dragging ? ' dropping' : ''}`} {...dropHandlers}>
          {dragging && (
            <div className="drop-overlay">
              <Icon name="download" size={30} />
              <div className="big">놓으면 cafe On 에 추가됩니다</div>
              <div>GIF · PNG · SVG · WebP — 브라우저 안에서만 처리되며 업로드되지 않습니다</div>
            </div>
          )}

          <header className="masthead">
            <div className="brand-mark">
              <Icon name="grid" size={22} strokeWidth={1.75} color="#fff" />
            </div>
            <div>
              <h1>아이콘 컴포넌트 테스터</h1>
              <div className="sub">
                {ALL_NAMES.length}개 아이콘 · 24×24 그리드 · 라인 스타일 · React
              </div>
            </div>
            <div className="spacer" />
            <button
              className="icon-btn"
              onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
              title={theme === 'light' ? '다크 모드로 전환' : '라이트 모드로 전환'}
              aria-label="테마 전환"
            >
              <Icon name={theme === 'light' ? 'moon' : 'sun'} size={18} />
            </button>
          </header>

          {/* ── 툴바 ───────────────────────────── */}
          <div className="toolbar">
            <div className="toolbar-row">
              <div className="search">
                <Icon name="search" size={16} />
                <input
                  ref={searchRef}
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="이름 · 태그 · 분류로 검색 (예: 삭제, arrow, 알림)"
                  aria-label="아이콘 검색"
                />
                {query ? (
                  <button className="clear" onClick={() => setQuery('')} aria-label="검색어 지우기">
                    <Icon name="x" size={13} />
                  </button>
                ) : (
                  <span className="kbd-hint">/</span>
                )}
              </div>

              <div className="control">
                <label htmlFor="size-range">크기</label>
                <input
                  id="size-range"
                  type="range"
                  min="12"
                  max="96"
                  step="1"
                  value={size}
                  onChange={(e) => setSize(Number(e.target.value))}
                />
                <span className="val">{size}px</span>
              </div>

              <div className="control">
                <label htmlFor="stroke-range">두께</label>
                <input
                  id="stroke-range"
                  type="range"
                  min="0.5"
                  max="3"
                  step="0.25"
                  value={strokeWidth}
                  onChange={(e) => setStrokeWidth(Number(e.target.value))}
                />
                <span className="val">{strokeWidth}</span>
              </div>

              <div className="swatches">
                {SWATCHES.map((c) => (
                  <button
                    key={c}
                    className="swatch"
                    aria-pressed={color === c}
                    onClick={() => setColor(c)}
                    title={c === 'currentColor' ? 'currentColor (글자색 상속)' : c}
                    style={
                      c === 'currentColor'
                        ? { background: 'var(--text)' }
                        : { background: c }
                    }
                  />
                ))}
                <input
                  type="color"
                  value={customColor}
                  onChange={(e) => {
                    setCustomColor(e.target.value);
                    setColor(e.target.value);
                  }}
                  title="직접 선택"
                  aria-label="사용자 지정 색상"
                />
              </div>

              <button
                className="icon-btn"
                aria-pressed={pixelGrid}
                onClick={() => setPixelGrid(!pixelGrid)}
                title="8px 그리드 오버레이 — 선이 픽셀에 정렬되는지 확인"
              >
                <Icon name="grid" size={17} />
              </button>

              <button
                className="icon-btn"
                onClick={() => {
                  setSize(24);
                  setStrokeWidth(1.75);
                  setColor('currentColor');
                  setPixelGrid(false);
                }}
                title="기본값으로 초기화"
              >
                <Icon name="refresh" size={17} />
              </button>
            </div>

            <div className="toolbar-row">
              <div className="chips">
                <button
                  className="chip"
                  aria-pressed={category === '전체'}
                  onClick={() => setCategory('전체')}
                >
                  전체
                  <span className="count">{counts['전체']}</span>
                </button>

                <button
                  className="chip cafe"
                  aria-pressed={category === CAFE}
                  onClick={() => setCategory(CAFE)}
                  title="내가 넣은 이미지 아이콘 (icon/ 폴더 + 직접 추가한 파일)"
                >
                  <Icon name="image" size={13} />
                  {CAFE}
                  <span className="count">{counts[CAFE]}</span>
                </button>

                <button
                  className="chip add"
                  onClick={() => fileRef.current?.click()}
                  title="GIF · PNG · SVG · WebP 파일을 cafe On 에 추가"
                >
                  <Icon name="plus" size={13} />
                  파일 추가
                </button>
                <input
                  ref={fileRef}
                  type="file"
                  accept="image/*"
                  multiple
                  hidden
                  onChange={(e) => {
                    addFiles(e.target.files);
                    e.target.value = '';
                  }}
                />

                <span className="chip-divider" aria-hidden="true" />

                {CATEGORIES.map((c) => (
                  <button
                    key={c}
                    className="chip"
                    aria-pressed={category === c}
                    onClick={() => setCategory(c)}
                  >
                    {c}
                    <span className="count">{counts[c] ?? 0}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* ── 결과 ───────────────────────────── */}
          <div className="result-line">
            <b>{total}</b>
            <span>개 표시 중</span>
            {assetResults.length > 0 && <span>· cafe On {assetResults.length}개 포함</span>}
            {query && <span>· 검색어 “{query}”</span>}
            <span style={{ marginLeft: 'auto' }}>아이콘을 클릭하면 코드를 복사할 수 있습니다</span>
          </div>

          {total === 0 ? (
            <div className="empty">
              {category === CAFE && !query ? (
                <>
                  <div className="big">cafe On 에 아직 파일이 없습니다</div>
                  <div>
                    파일을 이 페이지에 끌어다 놓거나 위의 <b>파일 추가</b> 버튼을 누르세요. GIF · PNG ·
                    SVG · WebP 를 지원합니다.
                  </div>
                </>
              ) : (
                <>
                  <div className="big">일치하는 아이콘이 없습니다</div>
                  <div>다른 검색어를 입력하거나 분류를 ‘전체’로 바꿔 보세요.</div>
                </>
              )}
            </div>
          ) : (
            <div
              className="grid"
              style={{ gridTemplateColumns: `repeat(auto-fill, minmax(${Math.max(104, size + 56)}px, 1fr))` }}
            >
              {assetResults.map((item) => (
                <button
                  key={item.url}
                  className={`cell asset${pixelGrid ? ' pixelgrid' : ''}`}
                  aria-selected={selected?.type === 'asset' && selected.item === item}
                  onClick={() => setSelected({ type: 'asset', item })}
                  title={`${item.file} — 클릭하면 상세 보기`}
                >
                  <span className="glyph">
                    <img
                      src={item.url}
                      alt=""
                      width={size}
                      height={size}
                      style={{ width: size, height: size, objectFit: 'contain' }}
                    />
                  </span>
                  <span className="name">{item.name}</span>
                </button>
              ))}

              {results.map((name) => (
                <button
                  key={name}
                  className={`cell${pixelGrid ? ' pixelgrid' : ''}`}
                  aria-selected={selected?.type === 'icon' && selected.name === name}
                  onClick={() => setSelected({ type: 'icon', name })}
                  title={`${name} — 클릭하면 상세 보기`}
                >
                  <span className="glyph">
                    <Icon name={name} {...iconProps} spin={name === 'loader'} />
                  </span>
                  <span className="name">{name}</span>
                </button>
              ))}
            </div>
          )}

          {/* ── 사용성 검증 랩 ─────────────────── */}
          <Lab {...iconProps} />

          {/* ── 컬러 · 애니메이션 아이콘 랩 ────── */}
          <AnimatedIconLab
            strokeWidth={strokeWidth}
            items={assets}
            onAddFiles={addFiles}
            onRemove={removeAsset}
          />

          {/* ── 상세 패널 ──────────────────────── */}
          {selected?.type === 'icon' && (
            <DetailPanel
              name={selected.name}
              size={size}
              strokeWidth={strokeWidth}
              color={color}
              customTags={customTags[selected.name] || []}
              onAddTags={(raw) => addTags(selected.name, raw)}
              onRemoveTag={(tag) => removeTag(selected.name, tag)}
              onClose={() => setSelected(null)}
              onCopy={copy}
            />
          )}
          {selected?.type === 'asset' && (
            <AssetPanel
              item={selected.item}
              size={size}
              strokeWidth={strokeWidth}
              customTags={customTags['@' + selected.item.file] || []}
              onAddTags={(raw) => addTags('@' + selected.item.file, raw)}
              onRemoveTag={(tag) => removeTag('@' + selected.item.file, tag)}
              onClose={() => setSelected(null)}
              onCopy={copy}
              onToast={showToast}
              onRemove={selected.item.dropped ? () => removeAsset(selected.item) : undefined}
            />
          )}

          {toast && (
            <div className="toast" role="status">
              <Icon name="check-circle" size={16} />
              {toast}
            </div>
          )}
        </div>
      );
    }

    /* ══════════════════════════════════════════
       상세 패널
       ══════════════════════════════════════════ */
    function DetailPanel({
      name,
      size,
      strokeWidth,
      color,
      customTags,
      onAddTags,
      onRemoveTag,
      onClose,
      onCopy,
    }) {
      const [rotate, setRotate] = useState(0);
      const [flip, setFlip] = useState(null);
      const [spin, setSpin] = useState(false);
      const [checker, setChecker] = useState(true);
      const icon = ICONS[name];

      useEffect(() => {
        setRotate(0);
        setFlip(null);
        setSpin(false);
      }, [name]);

      const jsx = useMemo(() => {
        const p = [`name="${name}"`];
        if (size !== 24) p.push(`size={${size}}`);
        if (strokeWidth !== 1.75) p.push(`strokeWidth={${strokeWidth}}`);
        if (color !== 'currentColor') p.push(`color="${color}"`);
        if (rotate) p.push(`rotate={${rotate}}`);
        if (flip) p.push(`flip="${flip}"`);
        if (spin) p.push('spin');
        return `<Icon ${p.join(' ')} />`;
      }, [name, size, strokeWidth, color, rotate, flip, spin]);

      const svg = useMemo(
        () => toSvgString(name, { size, strokeWidth, color }),
        [name, size, strokeWidth, color]
      );

      return (
        <>
          <div className="scrim" onClick={onClose} />
          <aside className="panel" role="dialog" aria-label={`${name} 아이콘 상세`}>
            <div className="panel-head">
              <Icon name={name} size={20} strokeWidth={strokeWidth} />
              <span className="title">{name}</span>
              <span className="spacer" />
              <button className="icon-btn" onClick={onClose} aria-label="닫기">
                <Icon name="x" size={17} />
              </button>
            </div>

            <div className="panel-body">
              <div className={`stage${checker ? '' : ' plain'}`}>
                <Icon
                  name={name}
                  size={Math.max(size, 72)}
                  strokeWidth={strokeWidth}
                  color={color}
                  rotate={rotate}
                  flip={flip}
                  spin={spin}
                />
              </div>

              <div className="demo-row" style={{ marginTop: 10 }}>
                <button className="demo-btn sm" onClick={() => setRotate((r) => (r + 90) % 360)}>
                  <Icon name="refresh" size={14} /> 회전 {rotate}°
                </button>
                <button
                  className="demo-btn sm"
                  onClick={() => setFlip(flip === 'x' ? null : 'x')}
                  aria-pressed={flip === 'x'}
                >
                  <Icon name="arrow-right" size={14} flip="x" /> 좌우 반전
                </button>
                <button className="demo-btn sm" onClick={() => setSpin(!spin)} aria-pressed={spin}>
                  <Icon name="loader" size={14} spin={spin} /> 회전 애니메이션
                </button>
                <button className="demo-btn sm" onClick={() => setChecker(!checker)}>
                  <Icon name="image" size={14} /> 배경
                </button>
              </div>

              <dl className="meta">
                <dt>분류</dt>
                <dd>{icon.category}</dd>
                <dt>크기</dt>
                <dd>
                  {size}px · 두께 {strokeWidth} · {color}
                </dd>
              </dl>

              <div className="section-label">태그</div>
              <TagEditor
                builtin={icon.tags}
                custom={customTags}
                onAdd={onAddTags}
                onRemove={onRemoveTag}
                onCopy={() => {
                  const all = [...icon.tags, ...customTags];
                  const code = `tags: [${all.map((t) => `'${t}'`).join(', ')}],`;
                  onCopy(code, 'tags 배열');
                }}
              />

              <div className="section-label">크기별 렌더링</div>
              <div className="sizes-strip">
                {PREVIEW_SIZES.map((s) => (
                  <figure key={s}>
                    <Icon name={name} size={s} strokeWidth={strokeWidth} color={color} />
                    <figcaption>{s}</figcaption>
                  </figure>
                ))}
              </div>

              <div className="section-label">React</div>
              <CodeBlock code={jsx} onCopy={() => onCopy(jsx, 'JSX')} />
              <CodeBlock
                code={`import Icon from './Icon';`}
                onCopy={() => onCopy(`import Icon from './Icon';`, 'import 문')}
              />

              <div className="section-label">SVG</div>
              <CodeBlock code={svg} onCopy={() => onCopy(svg, 'SVG')} />
            </div>
          </aside>
        </>
      );
    }

    /* ══════════════════════════════════════════
       크기 변환 · 내보내기
       원본(예: 640px)을 실제 목표 픽셀로 다시 렌더링해 저장한다
       ══════════════════════════════════════════ */
    function ExportBox({ item, url, size, onToast }) {
      const [px, setPx] = useState(Math.max(8, Math.round(size)));
      const [scale, setScale] = useState(1);
      const [type, setType] = useState('image/png');
      const [result, setResult] = useState(null); // { url, bytes }
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const outPx = Math.min(1024, Math.max(8, Math.round(px * scale)));
      const ext = type === 'image/webp' ? 'webp' : 'png';
      const filename = `${item.name}-${px}${scale > 1 ? `@${scale}x` : ''}.${ext}`;

      /* 설정이 바뀌면 미리보기를 다시 만든다 */
      useEffect(() => {
        let alive = true;
        let objectUrl = null;
        setError('');
        setBusy(true);

        const timer = setTimeout(async () => {
          try {
            const blob = await renderAtSize(url, outPx, type);
            if (!alive) return;
            objectUrl = URL.createObjectURL(blob);
            setResult({ url: objectUrl, bytes: blob.size, blob });
          } catch (e) {
            if (alive) {
              setResult(null);
              setError(e.message);
            }
          } finally {
            if (alive) setBusy(false);
          }
        }, 220);

        return () => {
          alive = false;
          clearTimeout(timer);
          if (objectUrl) URL.revokeObjectURL(objectUrl);
        };
      }, [url, outPx, type]);

      return (
        <div className="export-box">
          <div className="export-row">
            <label htmlFor="export-px">크기</label>
            <input
              id="export-px"
              type="number"
              min="8"
              max="512"
              value={px}
              onChange={(e) => setPx(Math.max(1, Number(e.target.value) || 1))}
            />
            <span className="unit">px</span>
            <div className="seg sm">
              {[1, 2, 3].map((s) => (
                <button key={s} className="seg-btn" aria-pressed={scale === s} onClick={() => setScale(s)}>
                  @{s}x
                </button>
              ))}
            </div>
          </div>

          <div className="export-row">
            <label>형식</label>
            <div className="seg sm">
              <button
                className="seg-btn"
                aria-pressed={type === 'image/png'}
                onClick={() => setType('image/png')}
              >
                PNG
              </button>
              <button
                className="seg-btn"
                aria-pressed={type === 'image/webp'}
                onClick={() => setType('image/webp')}
              >
                WebP
              </button>
            </div>
            <span className="export-out">→ {outPx} × {outPx}px</span>
          </div>

          {error ? (
            <p className="hint export-error">
              {error} — <code>npm run dev</code> 로 실행하거나 파일을 페이지에 드래그해 추가하면
              변환할 수 있습니다.
            </p>
          ) : (
            <div className="export-result">
              <div className="export-preview">
                {result && (
                  <img
                    src={result.url}
                    alt="변환 결과"
                    style={{ width: Math.min(outPx, 128), height: Math.min(outPx, 128) }}
                  />
                )}
              </div>
              <div className="export-info">
                <div className="export-size">
                  {busy ? '변환 중…' : result ? formatBytes(result.bytes) : '—'}
                </div>
                <div className="export-name">{filename}</div>
                <button
                  className="demo-btn sm"
                  disabled={!result || busy}
                  onClick={() => {
                    downloadBlob(result.blob, filename);
                    onToast(`${filename} 저장됨`);
                  }}
                >
                  <Icon name="download" size={13} />
                  내려받기
                </button>
              </div>
            </div>
          )}

          <p className="hint">
            원본을 목표 픽셀로 다시 그려 저장합니다. <b>애니메이션은 유지되지 않고 정지 이미지 한
            장</b>으로 저장됩니다 — 움직임을 살리려면 원본 툴(AE·Lottie)에서 작은 크기로 다시
            내보내세요.
          </p>
        </div>
      );
    }

    /* ══════════════════════════════════════════
       태그 편집기
       기본 태그(icons.js)는 고정, 사용자가 더한 태그만 삭제 가능
       ══════════════════════════════════════════ */
    function TagEditor({ builtin = [], custom = [], onAdd, onRemove, onCopy }) {
      const [value, setValue] = useState('');

      const submit = (e) => {
        e.preventDefault();
        if (!value.trim()) return;
        onAdd(value);
        setValue('');
      };

      return (
        <div className="tag-editor">
          <div className="tag-row">
            {builtin.map((t) => (
              <span className="tag" key={`b-${t}`}>
                {t}
              </span>
            ))}
            {custom.map((t) => (
              <span className="tag custom" key={`c-${t}`}>
                {t}
                <button type="button" onClick={() => onRemove(t)} aria-label={`${t} 태그 삭제`}>
                  <Icon name="x" size={10} strokeWidth={2.5} />
                </button>
              </span>
            ))}
            {builtin.length + custom.length === 0 && <span className="tag-empty">아직 태그가 없습니다</span>}
          </div>

          <form className="tag-form" onSubmit={submit}>
            <input
              value={value}
              onChange={(e) => setValue(e.target.value)}
              placeholder="태그 입력 후 Enter · 쉼표로 여러 개"
              aria-label="태그 추가"
            />
            <button type="submit" className="demo-btn sm" disabled={!value.trim()}>
              <Icon name="plus" size={13} />
              추가
            </button>
          </form>

          <div className="tag-foot">
            <span>추가한 태그는 이 브라우저에 저장되며 검색에 바로 반영됩니다.</span>
            <button type="button" className="link-btn" onClick={onCopy}>
              <Icon name="copy" size={12} />
              icons.js 용 tags 복사
            </button>
          </div>
        </div>
      );
    }

    function CodeBlock({ code, onCopy }) {
      return (
        <div className="code-block">
          <pre>{code}</pre>
          <button className="copy" onClick={onCopy} aria-label="복사">
            <Icon name="copy" size={14} />
          </button>
        </div>
      );
    }

    /* ══════════════════════════════════════════
       cafe On 이미지 아이콘 상세 패널
       ══════════════════════════════════════════ */
    function AssetPanel({
      item,
      size,
      strokeWidth,
      customTags,
      onAddTags,
      onRemoveTag,
      onClose,
      onCopy,
      onToast,
      onRemove,
    }) {
      const [{ status, url, meta, bytes }, restart] = useAsset(item.url, item.blob);
      const [checker, setChecker] = useState(true);
      const [natural, setNatural] = useState(null);

      const path = `icon/${item.file}`;
      const varName =
        (item.name.replace(/[^a-zA-Z0-9]+(.)?/g, (_, c) => (c ? c.toUpperCase() : '')) || 'my') +
        'Icon';

      const htmlSnippet = `<img src="${path}" alt="${item.name}" width="${size}" height="${size}" />`;
      const jsxSnippet =
        `import ${varName} from '../${path}';\n\n` +
        `<img src={${varName}} alt="${item.name}" width={${size}} height={${size}} />`;

      return (
        <>
          <div className="scrim" onClick={onClose} />
          <aside className="panel" role="dialog" aria-label={`${item.file} 상세`}>
            <div className="panel-head">
              <img src={url} alt="" width={20} height={20} style={{ objectFit: 'contain' }} />
              <span className="title">{item.file}</span>
              <span className="spacer" />
              <button className="icon-btn" onClick={onClose} aria-label="닫기">
                <Icon name="x" size={17} />
              </button>
            </div>

            <div className="panel-body">
              <div className={`stage${checker ? '' : ' plain'}`}>
                <img
                  src={url}
                  alt={item.name}
                  onLoad={(e) =>
                    setNatural({ w: e.currentTarget.naturalWidth, h: e.currentTarget.naturalHeight })
                  }
                  style={{ width: Math.max(size, 72), height: Math.max(size, 72), objectFit: 'contain' }}
                />
              </div>

              <div className="demo-row" style={{ marginTop: 10 }}>
                <button className="demo-btn sm" onClick={restart}>
                  <Icon name="play" size={13} strokeWidth={strokeWidth} /> 처음부터
                </button>
                <button className="demo-btn sm" onClick={() => setChecker(!checker)}>
                  <Icon name="image" size={13} strokeWidth={strokeWidth} /> 배경
                </button>
                {onRemove && (
                  <button className="demo-btn sm ghost" onClick={onRemove}>
                    <Icon name="trash" size={13} strokeWidth={strokeWidth} /> 목록에서 제거
                  </button>
                )}
              </div>

              <dl className="meta">
                <dt>분류</dt>
                <dd>{CAFE}</dd>
                <dt>원본</dt>
                <dd>{natural ? `${natural.w} × ${natural.h}px` : '…'}</dd>
                <dt>용량</dt>
                <dd>{bytes != null ? formatBytes(bytes) : status === 'limited' ? '측정 불가' : '…'}</dd>
                {meta && (
                  <>
                    <dt>프레임</dt>
                    <dd>
                      {meta.frames}장 · {(meta.durationMs / 1000).toFixed(1)}초
                    </dd>
                  </>
                )}
                <dt>경로</dt>
                <dd>
                  <code>{item.dropped ? '(드래그해 추가한 파일)' : path}</code>
                </dd>
              </dl>

              <div className="section-label">태그</div>
              <TagEditor
                custom={customTags}
                onAdd={onAddTags}
                onRemove={onRemoveTag}
                onCopy={() => {
                  const code = `tags: [${customTags.map((t) => `'${t}'`).join(', ')}],`;
                  onCopy(code, 'tags 배열');
                }}
              />

              <div className="section-label">크기별 렌더링</div>
              <div className="sizes-strip">
                {SIZE_LADDER.slice(0, 6).map((s) => (
                  <figure key={s}>
                    <img src={url} alt="" style={{ width: s, height: s, objectFit: 'contain' }} />
                    <figcaption>{s}</figcaption>
                  </figure>
                ))}
              </div>

              <div className="section-label">크기 변환 · 내보내기</div>
              <ExportBox item={item} url={url} size={size} onToast={onToast} />

              <div className="section-label">HTML</div>
              <CodeBlock code={htmlSnippet} onCopy={() => onCopy(htmlSnippet, 'HTML')} />

              <div className="section-label">React</div>
              <CodeBlock code={jsxSnippet} onCopy={() => onCopy(jsxSnippet, 'JSX')} />

              {item.dropped && (
                <p className="hint">
                  드래그해 추가한 파일은 새로고침하면 사라집니다. 계속 쓰려면 <code>icon/</code> 폴더에
                  넣어 두세요.
                </p>
              )}

              <p className="hint">
                자세한 진단(프레임·fps·투명도·용량 경고)은 아래 <b>컬러 · 애니메이션 아이콘</b>{' '}
                섹션에서 볼 수 있습니다.
              </p>
            </div>
          </aside>
        </>
      );
    }

    /* ══════════════════════════════════════════
       사용성 검증 랩
       실제 UI 안에서 정렬·가독성·대비를 확인
       ══════════════════════════════════════════ */
    function Lab({ size, strokeWidth, color }) {
      const p = { strokeWidth, color };
      return (
        <section className="lab">
          <h2>사용성 검증</h2>
          <p className="lead">
            실제 UI 맥락에 얹어 정렬·시각 무게·최소 크기 가독성을 확인합니다. 위 툴바의 두께·색상
            설정이 그대로 반영됩니다.
          </p>

          <div className="lab-grid">
            {/* 1. 텍스트 정렬 */}
            <div className="card">
              <h3>텍스트 baseline 정렬</h3>
              {[
                { fs: 12, s: 14 },
                { fs: 14, s: 16 },
                { fs: 16, s: 18 },
                { fs: 20, s: 24 },
              ].map(({ fs, s }) => (
                <div className="align-line" key={fs} style={{ fontSize: fs }}>
                  <Icon name="check-circle" size={s} {...p} />
                  <span>본문 {fs}px 옆에 {s}px 아이콘</span>
                </div>
              ))}
              <div className="hint">
                아이콘 높이는 보통 글자 크기의 1.15~1.25배일 때 시각적으로 맞습니다.
              </div>
            </div>

            {/* 2. 버튼 */}
            <div className="card">
              <h3>버튼 · 입력창</h3>
              <div className="demo-row" style={{ marginBottom: 12 }}>
                <button className="demo-btn primary">
                  <Icon name="plus" size={16} strokeWidth={strokeWidth} color="#fff" />
                  새로 만들기
                </button>
                <button className="demo-btn">
                  <Icon name="download" size={16} {...p} />
                  내려받기
                </button>
                <button className="demo-btn ghost">
                  <Icon name="trash" size={16} {...p} />
                  삭제
                </button>
                <button className="demo-btn" style={{ width: 36, padding: 0, justifyContent: 'center' }}>
                  <Icon name="more-horizontal" size={16} {...p} />
                </button>
              </div>
              <div className="demo-input">
                <span className="lead-icon">
                  <Icon name="search" size={16} {...p} />
                </span>
                <input placeholder="입력창 안 아이콘 정렬 확인" />
              </div>
              <div className="hint">아이콘과 라벨의 광학 중심이 어긋나지 않는지 확인하세요.</div>
            </div>

            {/* 3. 리스트 */}
            <div className="card">
              <h3>리스트 행</h3>
              <div className="demo-list">
                {[
                  ['folder', '프로젝트 문서', '폴더 · 12개 항목'],
                  ['file', '기획안-v3.pdf', '2.4 MB'],
                  ['image', '표지-시안.png', '840 KB'],
                  ['lock', '계약서.docx', '보호됨'],
                ].map(([icon, title, meta]) => (
                  <div className="row" key={title}>
                    <Icon name={icon} size={18} {...p} />
                    <div className="grow">
                      <div>{title}</div>
                      <div className="muted">{meta}</div>
                    </div>
                    <Icon name="chevron-right" size={16} strokeWidth={strokeWidth} color="var(--text-faint)" />
                  </div>
                ))}
              </div>
            </div>

            {/* 4. 상태 배지 */}
            <div className="card">
              <h3>상태 표시</h3>
              <div className="demo-row" style={{ marginBottom: 14 }}>
                <span className="badge ok">
                  <Icon name="check-circle" size={13} strokeWidth={strokeWidth} /> 완료
                </span>
                <span className="badge warn">
                  <Icon name="alert-triangle" size={13} strokeWidth={strokeWidth} /> 확인 필요
                </span>
                <span className="badge err">
                  <Icon name="x-circle" size={13} strokeWidth={strokeWidth} /> 실패
                </span>
              </div>
              <div className="demo-row">
                <span className="badge ok">
                  <Icon name="loader" size={13} strokeWidth={strokeWidth} spin /> 처리 중
                </span>
                <Icon name="loader" size={20} {...p} spin />
                <Icon name="bell" size={20} {...p} pulse />
              </div>
              <div className="hint">13px처럼 작은 크기에서 선이 뭉개지지 않는지 봅니다.</div>
            </div>

            {/* 5. 크기 × 두께 매트릭스 */}
            <div className="card" style={{ gridColumn: '1 / -1' }}>
              <h3>크기 × 두께 매트릭스</h3>
              <div style={{ overflowX: 'auto' }}>
                <table className="matrix">
                  <thead>
                    <tr>
                      <th>두께 \ 크기</th>
                      {[12, 14, 16, 18, 20, 24, 28, 32, 40, 48].map((s) => (
                        <th key={s}>{s}px</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {[1, 1.25, 1.5, 1.75, 2, 2.5].map((sw) => (
                      <tr key={sw}>
                        <td>{sw}</td>
                        {[12, 14, 16, 18, 20, 24, 28, 32, 40, 48].map((s) => (
                          <td key={s}>
                            <span style={{ display: 'inline-flex' }}>
                              <Icon name="settings" size={s} strokeWidth={sw} color={color} />
                            </span>
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="hint">
                작은 크기에서 두께가 굵으면 내부 여백이 막힙니다. 16px 이하에서는 1.5 전후를
                권장합니다.
              </div>
            </div>

            {/* 6. 대비 확인 */}
            <div className="card" style={{ gridColumn: '1 / -1' }}>
              <h3>배경 대비</h3>
              <div className="demo-row">
                {[
                  ['#ffffff', '#16191f', '흰 배경'],
                  ['#f0f2f5', '#16191f', '회색 배경'],
                  ['#16191f', '#ffffff', '검정 배경'],
                  ['#4f46e5', '#ffffff', '브랜드 배경'],
                  ['#fef3c7', '#92400e', '경고 배경'],
                ].map(([bg, fg, label]) => (
                  <div
                    key={label}
                    style={{
                      display: 'flex',
                      alignItems: 'center',
                      gap: 8,
                      padding: '10px 14px',
                      borderRadius: 10,
                      background: bg,
                      color: fg,
                      border: '1px solid var(--border)',
                      fontSize: 12,
                    }}
                  >
                    <Icon name="star" size={Math.min(size, 24)} strokeWidth={strokeWidth} />
                    <Icon name="heart" size={Math.min(size, 24)} strokeWidth={strokeWidth} />
                    <Icon name="zap" size={Math.min(size, 24)} strokeWidth={strokeWidth} />
                    {label}
                  </div>
                ))}
              </div>
              <div className="hint">
                색상을 <code>currentColor</code>로 두면 위처럼 배경별 글자색을 그대로 따라갑니다.
              </div>
            </div>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IconTester />);
  </script>
</body>
</html>
